<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pool Drill Book</title>
<meta name="description" content="Pool drills in the order you learn them, every table drawn to scale. Log scores, pass drills and get a practice session built for you.">
<meta name="theme-color" content="#f2f4f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101316" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Drill Book">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: one toolbar, a section rail on the left, one drill per sheet with the table first. */
:root{
  --paper:#f2f4f3; --sheet:#ffffff; --ink:#14191d; --ink-2:#55606a; --rule:#dde2e3;
  --chalk:#1f62c9; --chalk-soft:#e4ecf9; --rail:#1b1d22; --on-chalk:#ffffff; --good:#157a50; --good-soft:#dff3e8;
  --display:'Saira Condensed','Arial Narrow',sans-serif; --body:'Public Sans',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  --r0:#7a52d6; --r1:#2f7de1; --r2:#1ea672; --r3:#e2a316; --r4:#ea6a1f; --r5:#d8322c;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#101316; --sheet:#171b1f; --ink:#e9edef; --ink-2:#9aa5ad; --rule:#2a3137; --chalk:#6ea2ff; --chalk-soft:#1b2a44; --on-chalk:#0b1220; --good:#4fd39a; --good-soft:#123326; color-scheme:dark}}
:root[data-theme="dark"]{--paper:#101316; --sheet:#171b1f; --ink:#e9edef; --ink-2:#9aa5ad; --rule:#2a3137; --chalk:#6ea2ff; --chalk-soft:#1b2a44; --on-chalk:#0b1220; --good:#4fd39a; --good-soft:#123326; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--body);margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
header.top{display:grid;gap:8px;padding-bottom:18px}
h1{font:800 clamp(40px,7vw,68px)/.9 var(--display);letter-spacing:-.01em;margin:0;text-transform:uppercase}
h1 em{font-style:normal;color:var(--chalk)}
.lede{max-width:62ch;color:var(--ink-2);margin:0}

.bar{position:sticky;top:0;z-index:5;background:var(--paper);display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:12px;border-block:1px solid var(--rule)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;background:var(--sheet);padding:3px}
.seg button{font:600 12.5px/1 var(--mono);letter-spacing:.02em;border:0;background:transparent;color:var(--ink-2);padding:8px 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg small{font-weight:500;opacity:.7}
.seg svg{width:14px;height:14px;flex:none}
.bar input,.bar select{font:500 14px var(--body);padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);min-width:0;max-width:100%}
.bar input{flex:1 1 140px}
.filters{display:contents}
.filters select{max-width:190px}
.ftoggle{display:none;position:relative;font:600 12.5px var(--mono);border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:0 12px;cursor:pointer;align-items:center;gap:6px}
.ftoggle svg{width:16px;height:16px}
.ftoggle[aria-expanded="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.ftoggle b{display:none;position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--chalk);color:var(--on-chalk);font:700 10.5px/18px var(--mono);text-align:center;padding:0 4px}
.ftoggle b:not(:empty){display:block}
.clear{font:600 12px var(--mono);border:0;background:transparent;color:var(--chalk);padding:8px 4px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.clear[hidden]{display:none}
.chips{display:none}
.tabbar{display:none}
:is(.seg button,.bar input,.bar select,.ftoggle,.clear,.chips a,.tabbar button,.skill,.vt,.zoom,.toc a,.empty button,.more,summary,.tile,.row,.lbtn,.logbox input,.pick button,.undo,.lenbtn):focus-visible{outline:2px solid var(--chalk);outline-offset:2px}

/* tablets and phones: no section rail, so the sections become a strip of chips under the search bar */
@media (max-width:900px){
  .chips{display:flex;gap:6px;overflow-x:auto;width:100%;scrollbar-width:none;padding:2px 1px;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
  .chips::-webkit-scrollbar{display:none}
  .chips:empty{display:none}
  .chips a{flex:none;display:inline-flex;align-items:center;gap:6px;text-decoration:none;font:600 14px/1 var(--display);letter-spacing:.03em;text-transform:uppercase;color:var(--ink-2);background:var(--sheet);border:1px solid var(--rule);border-radius:999px;padding:8px 12px;white-space:nowrap}
  .chips a b{font:600 10.5px var(--mono);color:var(--chalk)}
  .chips a[aria-current="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .chips a[aria-current="true"] b{color:inherit;opacity:.7}
}
/* phones: modes move to a tab bar at the bottom, the top bar keeps search, layout and filters */
@media (max-width:760px){
  body{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  .wrap{padding-top:20px}
  .bar{gap:8px;padding-block:8px}
  .bar .modes{display:none}
  .bar input,.bar select{font-size:16px;height:40px}
  .bar input{order:-1;flex:1 1 100px}
  .seg.view button{padding:0;width:40px;height:32px}
  .seg.view .vl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .seg.view svg{width:16px;height:16px}
  .ftoggle{display:inline-flex;height:40px}
  .filters{display:none;width:100%;gap:8px;flex-wrap:wrap;align-items:center}
  .filters.open{display:flex}
  .filters select{flex:1 1 140px;max-width:none}
  .tabbar{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--sheet);border-top:1px solid var(--rule);padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
  .tabbar button{all:unset;box-sizing:border-box;display:grid;justify-items:center;align-content:center;gap:3px;min-height:58px;cursor:pointer;color:var(--ink-2);font:600 11px/1 var(--mono);letter-spacing:.02em;-webkit-tap-highlight-color:transparent}
  .tabbar button svg{width:22px;height:22px}
  .tabbar button[aria-pressed="true"]{color:var(--chalk)}
  .tabbar button[aria-pressed="true"] svg{stroke-width:2.2}
  .tabbar small{font:500 10px var(--mono);opacity:.75}
}

details.legend{margin-top:12px;color:var(--ink-2);font:500 12.5px var(--mono)}
details.legend summary{cursor:pointer;width:max-content;max-width:100%}
.legend-row{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:10px}
.legend-row span{display:inline-flex;align-items:center;gap:7px}
.sw{display:inline-grid;place-items:center;width:44px;height:22px;border-radius:5px;background:#1597d4}
.sw svg{width:40px;height:18px}
.tablerow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.tablerow select{font:500 14px var(--body);padding:7px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);max-width:100%}

.layout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:34px;margin-top:24px}
.layout.solo{grid-template-columns:minmax(0,1fr)}
.toc{position:sticky;top:calc(var(--barh,62px) + 14px);align-self:start;display:grid;gap:1px}
.toc a[aria-current="true"]{background:var(--chalk-soft);color:var(--ink)}
.toc a{display:grid;grid-template-columns:22px 1fr auto;gap:6px;align-items:baseline;text-decoration:none;color:var(--ink-2);padding:6px 8px;border-radius:6px;font:600 15px/1.2 var(--display);letter-spacing:.02em;text-transform:uppercase}
.toc a span:first-child{font:600 11px var(--mono);color:var(--chalk)}
.toc a small{font:500 11px var(--mono)}
.toc a:hover{background:var(--chalk-soft);color:var(--ink)}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}.toc{display:none}}

section.sec{display:grid;gap:16px;margin-bottom:40px;scroll-margin-top:calc(var(--barh,62px) + 14px)}
@media (max-width:760px){
  header.top{gap:6px;padding-bottom:14px}
  .lede{font-size:14px}
  .layout{margin-top:16px}
  section.sec{gap:12px;margin-bottom:30px}
  .sec-num{font-size:44px}
  .sec-head h2{font-size:25px}
  .sec-head p{font-size:14px}
}
.sec-head{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;align-items:end;padding-bottom:4px}
.sec-num{font:800 52px/.8 var(--display);color:var(--chalk);grid-row:span 2}
.sec-head h2{font:800 28px/1 var(--display);text-transform:uppercase;margin:0;letter-spacing:.01em;text-wrap:balance}
.sec-head p{margin:0;color:var(--ink-2);max-width:66ch}

.drill{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);overflow:hidden}
@media (max-width:760px){.drill{grid-template-columns:minmax(0,1fr)}}
.board{background:var(--rail);padding:10px;display:flex;flex-direction:column;justify-content:center;gap:8px;position:relative}
.board svg{display:block;width:100%;height:auto}
.svgwrap{cursor:zoom-in;aspect-ratio:9/5;border-radius:6px}
.svgwrap:empty{background:#1597d4;box-shadow:inset 0 0 0 14px #17191d}
.svgwrap svg{height:100%}
.zoom{position:absolute;top:14px;right:14px;z-index:2;width:32px;height:32px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(10,14,18,.55);color:#fff;cursor:pointer;display:grid;place-items:center;padding:0}
.zoom:hover{background:rgba(10,14,18,.8)}
.zoom svg{width:16px;height:16px}
.vtabs{display:grid;gap:6px}
.vrow{display:flex;flex-wrap:wrap;gap:5px}
.vt{font:600 11.5px/1 var(--mono);letter-spacing:.03em;padding:7px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:transparent;color:#d4dbe0;cursor:pointer;min-width:30px}
.vt[aria-pressed="true"]{background:#fff;color:#111;border-color:#fff}
.vnote{font:500 12.5px/1.45 var(--body);color:#d6dde2;margin:0}
@media (max-width:760px){.board{padding:6px}.zoom{top:12px;right:12px;width:38px;height:38px}.txt{padding:14px 16px 16px}.txt h3{font-size:21px}.vtabs{padding:2px 2px 4px}}
@media (pointer:coarse){.vt{min-height:36px;min-width:40px;font-size:12.5px}.skill{padding:7px 10px}.skill.main{padding:8px 11px}}

.txt{padding:18px 20px;display:grid;gap:10px;align-content:start;min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px}
.txt h3{font:700 23px/1.05 var(--display);margin:0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.meter{display:inline-flex;align-items:center;gap:7px;font:600 11px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.meter .bars{display:inline-grid;grid-template-columns:repeat(6,6px);gap:2px}
.meter .bars i{height:9px;border-radius:2px;background:var(--rule)}
.skills{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.skill{font:600 11px/1 var(--mono);padding:5px 8px;border-radius:5px;border:0;background:var(--chalk-soft);color:var(--chalk);cursor:pointer}
.skill.main{background:var(--chalk);color:var(--on-chalk);font-size:11.5px;padding:6px 9px}
.skill:hover{outline:1px solid var(--chalk)}
.rec{font:600 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--good);margin-left:4px}
.passed{display:inline-flex;align-items:center;gap:4px;font:600 10.5px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--good);background:var(--good-soft);border-radius:5px;padding:4px 7px}
.passed svg{width:11px;height:11px}
.purpose{margin:0;font-weight:500}
.txt ol{margin:0;padding-left:20px;color:var(--ink-2);display:grid;gap:5px}
.txt ol li::marker{font:600 12px var(--mono);color:var(--chalk)}
.score{margin:0;font-size:13.5px}
.score b{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-right:6px}
.tipbox{display:flex;align-items:center;gap:10px}
.tipbox svg{width:46px;height:46px;flex:none}
.tipbox span{font:500 12px var(--mono);color:var(--ink-2)}

.logbox{border-top:1px solid var(--rule);padding-top:12px;display:grid;gap:8px}
.lb-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;align-items:baseline}
.lb-head b{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.lb-head span{font-size:12.5px;color:var(--ink-2)}
.lb-entry{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.logbox input{width:76px;font:600 15px var(--mono);padding:7px 8px;border:1px solid var(--rule);border-radius:7px;background:var(--paper);color:var(--ink);font-variant-numeric:tabular-nums}
.lbtn{font:600 12.5px var(--mono);border:1px solid var(--chalk);background:var(--chalk);color:var(--on-chalk);border-radius:7px;padding:8px 12px;cursor:pointer}
.lb-hist{display:flex;flex-wrap:wrap;gap:5px}
.lb-hist span{font:500 11.5px var(--mono);padding:4px 7px;border-radius:5px;background:var(--paper);border:1px solid var(--rule);color:var(--ink-2);font-variant-numeric:tabular-nums}
.lb-hist span.ok{border-color:var(--good);color:var(--good)}
.lb-status{margin:0;font-size:13px;color:var(--ink)}
.pick{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:4px;max-width:480px}
@media (max-width:760px){.pick{grid-template-columns:repeat(var(--m),minmax(0,1fr));gap:6px}}
.pick button{font:600 13px/1 var(--mono);height:34px;padding:0;border-radius:7px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.pick button.ok{border-color:color-mix(in srgb,var(--good) 55%,var(--rule))}
.pick button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.lbtn:disabled{opacity:.45;cursor:default}
.undo{font:600 12px var(--mono);border:0;background:transparent;color:var(--chalk);padding:4px 2px;margin-left:4px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
@media (pointer:coarse),(max-width:760px){.pick button{height:42px;font-size:15px}.lbtn{min-height:42px;padding:0 16px}.logbox input{height:42px;font-size:16px;width:90px}.undo{padding:8px 4px}}

/* grid view */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px}
.tile{all:unset;box-sizing:border-box;display:grid;grid-template-rows:auto 1fr;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;overflow:hidden;cursor:pointer;min-width:0}
.tile:hover{border-color:var(--chalk)}
.thumb{background:var(--rail);display:block;aspect-ratio:8.72/4.72;overflow:hidden}
.thumb:empty{background:#1597d4;box-shadow:inset 0 0 0 7px #17191d}
.thumb svg{display:block;width:100%;height:100%}
.tile .thumb{border-bottom:1px solid var(--rule)}
.tile .tt{padding:10px 12px 12px;display:grid;gap:6px;align-content:start;min-width:0}
@media (max-width:600px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile .tt{padding:8px 10px 10px;gap:5px}.tile h3{font-size:15px}.tile .meter{font-size:10px}.tile .tag1{font-size:10px}}
.tile h3,.row h3{font:700 17px/1.1 var(--display);text-transform:uppercase;letter-spacing:.01em;margin:0;text-wrap:balance}
.tagrow{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tag1{font:600 10.5px/1 var(--mono);padding:4px 7px;border-radius:5px;background:var(--chalk-soft);color:var(--chalk)}
/* list view */
.rows{display:grid;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.row{all:unset;box-sizing:border-box;display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:14px;align-items:center;padding:8px 14px 8px 8px;cursor:pointer;border-top:1px solid var(--rule)}
.row:first-child{border-top:0}
.row:hover{background:var(--chalk-soft)}
.row .thumb{border-radius:6px}
.row .rt{display:grid;gap:4px;min-width:0}
.row .rp{margin:0;font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rside{display:grid;gap:6px;justify-items:end}
@media (max-width:600px){.row{grid-template-columns:118px minmax(0,1fr);gap:5px 12px;padding:8px 12px 8px 8px}.row .thumb{grid-row:span 2;align-self:center}.row .rside{grid-column:2;justify-items:start;align-self:start;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}.row .rt{align-self:end}.row h3{font-size:16px}.row .rp{display:none}}

/* session */
.session{display:grid;gap:18px}
.sess-head{display:grid;gap:6px}
.sess-head h2{font:800 34px/1 var(--display);text-transform:uppercase;margin:0}
.sess-head p{margin:0;color:var(--ink-2);max-width:66ch}
.sess-head b{color:var(--ink)}
.sess-ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sess-ctrl .lab{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-right:4px}
.lenbtn{font:600 12.5px var(--mono);border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer}
.lenbtn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
@media (pointer:coarse),(max-width:760px){.lenbtn{min-height:40px}.sess-head h2{font-size:30px}}
.blocks{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.block{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:start}
.bk-l{display:grid;gap:2px;padding-top:10px}
.bk-time{font:800 26px/1 var(--display);color:var(--chalk)}
.bk-kind{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.block .rows{border-radius:10px}
@media (max-width:600px){.block{grid-template-columns:minmax(0,1fr)}.bk-l{display:flex;gap:10px;align-items:baseline;padding-top:0}}
.stats{display:flex;flex-wrap:wrap;gap:10px 28px;padding:14px 16px;background:var(--sheet);border:1px solid var(--rule);border-radius:10px}
.stat{display:grid;gap:2px}
.stat b{font:800 28px/1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font:600 11px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.sync{font-size:12.5px;color:var(--ink-2);margin:0}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.empty{display:grid;gap:12px;justify-items:start;color:var(--ink-2);padding:28px 0}
.empty p{margin:0}
.empty button,.more{font:600 13px var(--mono);border:1px solid var(--chalk);background:var(--chalk);color:var(--on-chalk);border-radius:8px;padding:9px 14px;cursor:pointer}
.more{background:transparent;color:var(--chalk)}

dialog#dd{border:0;border-radius:12px;padding:0;width:min(1120px,96vw);max-height:94vh;background:var(--paper);color:var(--ink)}
dialog#dd::backdrop{background:rgba(5,8,12,.6)}
.ddhead{display:flex;justify-content:flex-end;padding:10px 12px 0}
.ddhead button{font:600 12px var(--mono);border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer}
.ddbody{padding:10px 12px 12px}
dialog#zoomd{border:0;border-radius:12px;padding:0;width:min(1200px,96vw);max-height:94vh;background:var(--rail);color:#fff;box-shadow:0 20px 60px rgba(0,0,0,.5)}
dialog#zoomd::backdrop{background:rgba(5,8,12,.72)}
.zhead{display:flex;align-items:center;gap:12px;padding:12px 16px}
.zhead h3{font:700 22px/1.1 var(--display);text-transform:uppercase;margin:0;flex:1;letter-spacing:.01em}
.zhead button{font:600 12px var(--mono);border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}
.zbody{padding:0 14px 14px;display:grid;place-items:center}
.zbody svg{display:block;width:100%;height:auto;max-height:calc(94vh - 76px)}
body:has(dialog[open]){overflow:hidden}
@media (max-height:520px){
  dialog#zoomd{width:100%;max-width:100%;height:100%;max-height:100%;margin:0;border-radius:0;display:none;flex-direction:column}
  dialog#zoomd[open]{display:flex}
  .zhead{padding:6px 12px}.zhead h3{font-size:16px}
  .zbody{flex:1;min-height:0;padding:0 8px 8px}
  .zbody svg{width:100%;height:100%;max-height:100%}
}
@media (max-width:760px){
  dialog#dd,dialog#zoomd{width:100%;max-width:100%;height:100%;max-height:100%;margin:0;border-radius:0}
  .ddhead{position:sticky;top:0;z-index:3;background:var(--paper);padding:10px 12px;border-bottom:1px solid var(--rule);justify-content:space-between;align-items:center;gap:10px}
  .ddhead span{font:700 17px/1.1 var(--display);text-transform:uppercase;letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ddhead button,.zhead button{min-height:40px;padding:0 16px;font-size:13px}
  .ddbody{padding:10px 10px calc(16px + env(safe-area-inset-bottom,0px))}
  .ddbody .drill{border-radius:10px}
  dialog#zoomd{display:none;flex-direction:column}
  dialog#zoomd[open]{display:flex}
  .zhead{padding:10px 12px}
  .zhead h3{font-size:18px}
  .zbody{flex:1;min-height:0;padding:0 8px calc(8px + env(safe-area-inset-bottom,0px));display:grid;place-items:center}
  .zbody svg{width:100%;height:100%;max-height:100%}
}
@media (min-width:761px){.ddhead span{display:none}}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}

<body>
<div class="wrap">
  <header class="top">
    <h1>Pool Drill <em>Book</em></h1>
    <p class="lede">Drills in the order you learn them, from your stroke to safeties and jump shots, with every table drawn to scale. Log your scores, pass each drill, and let My session pick what to practice next.</p>
  </header>

  <div class="bar" id="bar">
    <div class="seg modes" role="group" aria-label="What to show">
      <button type="button" data-mode="rec" aria-pressed="true">Recommended<small class="n-rec"></small></button>
      <button type="button" data-mode="all" aria-pressed="false">All drills<small class="n-all"></small></button>
      <button type="button" data-mode="session" aria-pressed="false">My session</button>
    </div>
    <div class="seg view" role="group" aria-label="Layout">
      <button type="button" data-view="cards" aria-pressed="true"><svg viewBox="0 0 14 14" fill="currentColor" aria-hidden="true"><rect x="0" y="1" width="8" height="5" rx="1"/><rect x="9.5" y="1.5" width="4.5" height="1.3"/><rect x="9.5" y="4" width="3.5" height="1.3"/><rect x="0" y="8" width="8" height="5" rx="1"/><rect x="9.5" y="8.5" width="4.5" height="1.3"/><rect x="9.5" y="11" width="3.5" height="1.3"/></svg><span class="vl">Cards</span></button>
      <button type="button" data-view="grid" aria-pressed="false"><svg viewBox="0 0 14 14" fill="currentColor" aria-hidden="true"><rect x="0" y="0" width="6" height="6" rx="1"/><rect x="8" y="0" width="6" height="6" rx="1"/><rect x="0" y="8" width="6" height="6" rx="1"/><rect x="8" y="8" width="6" height="6" rx="1"/></svg><span class="vl">Grid</span></button>
      <button type="button" data-view="list" aria-pressed="false"><svg viewBox="0 0 14 14" fill="currentColor" aria-hidden="true"><rect x="0" y="1" width="4" height="3" rx=".6"/><rect x="5.5" y="1.8" width="8.5" height="1.4"/><rect x="0" y="5.5" width="4" height="3" rx=".6"/><rect x="5.5" y="6.3" width="8.5" height="1.4"/><rect x="0" y="10" width="4" height="3" rx=".6"/><rect x="5.5" y="10.8" width="8.5" height="1.4"/></svg><span class="vl">List</span></button>
    </div>
    <input id="q" type="search" placeholder="Search drills" aria-label="Search drills" enterkeyhint="search">
    <button type="button" class="ftoggle" id="ftoggle" aria-expanded="false" aria-controls="filters" aria-label="Filters"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M2 4h12M4.5 8h7M7 12h2"/></svg><b id="fcount"></b></button>
    <div class="filters" id="filters">
      <select id="skill" aria-label="Skill"></select>
      <select id="diff" aria-label="Difficulty"></select>
      <button type="button" class="clear" id="fclear" hidden>Clear</button>
    </div>
    <nav class="chips" id="chips" aria-label="Sections"></nav>
  </div>

  <details class="legend"><summary>Table and legend</summary><div class="tablerow"><label for="tsel">Draw tables with</label><select id="tsel"></select></div><div class="legend-row" id="legend"></div></details>

  <div class="layout" id="layout">
    <nav class="toc" id="toc" aria-label="Sections"></nav>
    <main id="main"></main>
  </div>
</div>
<nav class="tabbar" aria-label="What to show">
  <button type="button" data-mode="rec" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg>Recommended</button>
  <button type="button" data-mode="all" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H10v16H5.5A1.5 1.5 0 0 1 4 18.5zM10 4h4v16h-4zM14.5 4.6l3.9-1 3.1 15.5-3.9 1z"/></svg>All drills</button>
  <button type="button" data-mode="session" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 2M9.5 2.5h5M19 6l1.5-1.5"/></svg>My session</button>
</nav>
<dialog id="dd" aria-labelledby="ddt"><div class="ddhead"><span id="ddt">Drill</span><button type="button" id="ddclose">Close</button></div><div class="ddbody" id="ddb"></div></dialog>
<dialog id="zoomd" aria-labelledby="zt"><div class="zhead"><h3 id="zt"></h3><button type="button" id="zclose">Close</button></div><div class="zbody" id="zb"></div></dialog>

<script>(function (root) {
  const IN = 1 / 12.5;
  const G = {
    L: 8, W: 4,
    ballR: 2.25 / 2 * IN,
    cushion: 2.0 * IN,
    railTop: 4.0 * IN,
    sight: (3 + 11 / 16) * IN,
    rowStep: 2.25 * IN * Math.sqrt(3) / 2,
    footSpot: [2, 2], headSpot: [6, 2], center: [4, 2], headString: 6,
  };
  G.margin = G.cushion + G.railTop;
  const COLORS = {
    1: "#f3c21b", 2: "#1d4fc4", 3: "#d52b2b", 4: "#6a2ea3", 5: "#f2711c",
    6: "#178a43", 7: "#7b2414", 8: "#141414",
  };
  const PATH = { obj: "#ffd23a", cue: "#ffffff", alt: "#ff5a4f", blue: "#2a6bff", dark: "#1a1a1a" };
  const f = (n) => +n.toFixed(4);
  const sy = (y) => f(G.W - y);
  const pt = (p) => f(p[0]) + "," + sy(p[1]);
  const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  const JAW = { corner: 142, side: 104 };
  const TABLES = {
    wpa: { name: "Standard 9 ft", short: "Standard",
      corner: { mouth: 4.5, jaw: 142, shelf: 1.5 }, side: { mouth: 5.0, jaw: 104, shelf: 0.25 }, },
    predator: { name: "Predator Apex 9 ft", short: "Predator Apex",
      corner: { mouth: 4.25, throat: 3.82, shelf: 1.25 }, side: { mouth: 4.92, throat: 4.13, shelf: 0.25 }, },
    diamond: { name: "Diamond Pro-Am, Pro Cut", short: "Diamond Pro Cut",
      corner: { mouth: 4.4375, jaw: 141, shelf: 1.75 }, side: { mouth: 5.0625, jaw: 102, shelf: 0.25 }, },
    brunswick: { name: "Brunswick Gold Crown VI Tournament", short: "Gold Crown VI",
      corner: { mouth: 4.5, jaw: 142, shelf: 1.5 }, side: { mouth: 5.0, jaw: 104, shelf: 0.25 }, },
    rasson: { name: "Rasson Victory II Plus", short: "Rasson Victory II",
      corner: { mouth: 4.5, jaw: 142, shelf: 1.5 }, side: { mouth: 5.0, jaw: 104, shelf: 0.25 }, },
    rasson4: { name: "Rasson pro setup, 4 in corners", short: "Rasson 4 in",
      corner: { mouth: 4.0, jaw: 142, shelf: 1.0 }, side: { mouth: 4.5, jaw: 104, shelf: 0.25 }, },
  };
  let current = "wpa";
  function resolve(t) {
    const c = G.cushion, ci = c / IN;
    const cm = t.corner.mouth, sm = t.side.mouth;
    const kc = t.corner.throat ? ci + (cm - t.corner.throat) / Math.SQRT2 : ci / Math.tan(((180 - t.corner.jaw) * Math.PI) / 180);
    const ks = t.side.throat ? (sm - t.side.throat) / 2 : ci / Math.tan(((180 - t.side.jaw) * Math.PI) / 180);
    const cThroat = cm - Math.SQRT2 * (kc - ci), sThroat = sm - 2 * ks;
    return {
      cornerMouth: cm * IN, sideMouth: sm * IN, kc: kc * IN, ks: ks * IN,
      cornerShelf: t.corner.shelf * IN, sideShelf: t.side.shelf * IN,
      cornerHoleR: 0.70 * cThroat * IN, sideHoleR: 0.60 * sThroat * IN,
      cornerJaw: 180 - (Math.atan(ci / kc) * 180) / Math.PI, sideJaw: 180 - (Math.atan(ci / ks) * 180) / Math.PI,
      cornerThroat: cThroat, sideThroat: sThroat,
    };
  }
  const tableKey = (k) => (k && TABLES[k] ? k : current);
  function pocketGeometry(key) {
    const R = resolve(TABLES[tableKey(key)]);
    const c = G.cushion, W = G.W, L = G.L;
    const a = R.cornerMouth / Math.SQRT2;
    const s = R.sideMouth / 2;
    const kc = R.kc;
    const ks = R.ks;
    const tl = {
      mouth: [[a, W], [0, W - a]],
      throat: [[a - kc, W + c], [-c, W - a + kc]],
    };
    const mm = [a / 2, W - a / 2], n = [-Math.SQRT1_2, Math.SQRT1_2];
    const rc = R.cornerHoleR, dc = R.cornerShelf + rc;
    tl.hole = { c: [mm[0] + dc * n[0], mm[1] + dc * n[1]], r: rc };
    const mir = (p, mx, my) => [mx ? L - p[0] : p[0], my ? W - p[1] : p[1]];
    const corners = [[0, 0], [1, 0], [0, 1], [1, 1]].map(([mx, my]) => ({
      mouth: tl.mouth.map((p) => mir(p, mx, my)), throat: tl.throat.map((p) => mir(p, mx, my)),
      hole: { c: mir(tl.hole.c, mx, my), r: tl.hole.r },
    }));
    const sides = [0, 1].map((my) => {
      const y0 = my ? 0 : W, y1 = my ? -c : W + c, dir = my ? -1 : 1;
      return { mouth: [[4 - s, y0], [4 + s, y0]], throat: [[4 - s + ks, y1], [4 + s - ks, y1]],
        hole: { c: [4, y0 + dir * (R.sideShelf + R.sideHoleR)], r: R.sideHoleR } };
    });
    const cush = [];
    for (const my of [0, 1]) {
      const y0 = my ? 0 : W, y1 = my ? -c : W + c;
      cush.push([[a, y0], [4 - s, y0], [4 - s + ks, y1], [a - kc, y1]]);
      cush.push([[4 + s, y0], [L - a, y0], [L - a + kc, y1], [4 + s - ks, y1]]);
    }
    for (const mx of [0, 1]) {
      const x0 = mx ? L : 0, x1 = mx ? L + c : -c;
      cush.push([[x0, a], [x0, W - a], [x1, W - a + kc], [x1, a - kc]]);
    }
    const bed = [[0, 0], [L, 0], [L, W], [0, W]];
    return { corners, sides, cush, bed, a, s, R };
  }
  function tableSVG(o) {
    const m = G.margin;
    const P = pocketGeometry(o.table);
    let s = "";
    s += `<rect x="${-m}" y="${-m}" width="${G.L + 2 * m}" height="${G.W + 2 * m}" rx="0.26" fill="${o.rail}"/>`;
    const pockets = [...P.corners, ...P.sides];
    s += `<rect x="${f(-G.cushion - 0.06)}" y="${f(-G.cushion - 0.06)}" width="${f(G.L + 2 * G.cushion + 0.12)}" height="${f(G.W + 2 * G.cushion + 0.12)}" rx="0.06" fill="${o.railInner || o.rail}"/>`;
    s += `<polygon points="${P.bed.map(pt).join(" ")}" fill="${o.cloth}"/>`;
    if (o.clothShade) s += `<rect x="0" y="0" width="${G.L}" height="${G.W}" fill="url(#${o.clothShade})"/>`;
    for (const pk of pockets) s += `<polygon points="${[pk.mouth[0], pk.throat[0], pk.throat[1], pk.mouth[1]].map(pt).join(" ")}" fill="${o.shelf}"/>`;
    for (const pk of pockets)
      s += `<circle cx="${f(pk.hole.c[0])}" cy="${sy(pk.hole.c[1])}" r="${pk.hole.r}" fill="${o.pocket}" stroke="${o.liner}" stroke-width="0.022"/>`;
    if (o.grid) {
      let g = "";
      for (let x = 0.5; x < G.L; x += 0.5) g += `M${x} 0V${G.W}`;
      for (let y = 0.5; y < G.W; y += 0.5) g += `M0 ${y}H${G.L}`;
      s += `<path d="${g}" stroke="${o.gridColor}" stroke-width="0.008" fill="none"/>`;
    }
    for (const p of P.cush) s += `<polygon points="${p.map(pt).join(" ")}" fill="${o.cushion}" stroke="${o.nose}" stroke-width="0.01" stroke-linejoin="miter"/>`;
    s += `<line x1="${G.headString}" y1="0" x2="${G.headString}" y2="${G.W}" stroke="${o.line}" stroke-width="0.012"/>`;
    for (const sp of [G.footSpot, G.headSpot, G.center])
      s += `<circle cx="${sp[0]}" cy="${sy(sp[1])}" r="0.025" fill="${o.spot}"/>`;
    const off = G.sight;
    const dia = (x, y) => `<path d="M${f(x)} ${f(sy(y) - 0.045)}l0.03 0.045l-0.03 0.045l-0.03 -0.045Z" fill="${o.sightColor}"/>`;
    for (let x = 1; x < G.L; x++) if (x !== 4)
      for (const y of [-off, G.W + off]) s += dia(x, y);
    for (let y = 1; y < G.W; y++) for (const x of [-off, G.L + off]) s += dia(x, y);
    return s;
  }
  const GENERIC = { s: "#5b5f6b", x: "#a99bc4" };
  let PORTRAIT = false;
  const MODE = { thumb: false, line: 1, ball: 1 };
  const up = (x, y) => (PORTRAIT ? ` transform="rotate(-90 ${f(x)} ${f(y)})"` : "");
  function ball(n, x, y, opts = {}) {
    const r = opts.r || G.ballR, cx = f(x), cy = sy(y), sh = opts.shade;
    const faint = opts.faint;
    const op = (faint ? ' opacity="0.5"' : "") + up(cx, cy);
    const edge = `stroke="#151515" stroke-width="0.007"${faint ? ' stroke-dasharray="0.025 0.016"' : ""}`;
    const gloss = sh && !faint ? `<circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#${sh})"/>` : "";
    if (n === "c" || n === 0 || n === "o") {
      return `<g${op}><circle cx="${cx}" cy="${cy}" r="${r}" fill="#fbfbf6"/>${gloss}<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" ${edge}/></g>`;
    }
    const num = n === "s" || n === "x" ? 0 : +n;
    const stripe = n === "s" || num > 8;
    const base = n === "s" ? GENERIC.s : n === "x" ? GENERIC.x : COLORS[num > 8 ? num - 8 : num];
    let s = `<g${op}>`;
    if (stripe) {
      s += `<clipPath id="cp${opts.uid}"><circle cx="${cx}" cy="${cy}" r="${r}"/></clipPath>`;
      s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#fbfbf6"/>`;
      s += `<rect x="${f(x - r)}" y="${f(cy - r * 0.6)}" width="${f(2 * r)}" height="${f(r * 1.2)}" fill="${base}" clip-path="url(#cp${opts.uid})"/>`;
    } else {
      s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${base}"/>`;
    }
    if (num && !MODE.thumb) {
      s += `<circle cx="${cx}" cy="${cy}" r="${f(r * 0.52)}" fill="#fbfbf6"/>`;
      s += `<text x="${cx}" y="${f(cy + r * 0.2)}" font-size="${f(r * (num > 9 ? 0.56 : 0.66))}" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#111" letter-spacing="${num > 9 ? -0.004 : 0}">${num}</text>`;
    }
    s += gloss + `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" ${edge}/>`;
    return s + "</g>";
  }
  function ghost(x, y, label) {
    const r = G.ballR * MODE.ball, k = MODE.thumb ? 1.6 : 1;
    let s = `<circle cx="${f(x)}" cy="${sy(y)}" r="${f(r)}" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.95" stroke-width="${f(0.011 * k)}" stroke-dasharray="${f(0.028 * k)} ${f(0.02 * k)}"/>`;
    if (label != null && !MODE.thumb) s += `<text x="${f(x)}" y="${f(sy(y) + 0.032)}" font-size="0.085" text-anchor="middle" font-family="'Saira Condensed',Arial Narrow,sans-serif" font-weight="700" fill="#fff"${up(x, sy(y))}>${esc(label)}</text>`;
    return s;
  }
  function cueStick(c) {
    const [x, y] = c.at, [tx, ty] = c.to;
    const L0 = Math.hypot(tx - x, ty - y) || 1, ux = (tx - x) / L0, uy = (ty - y) / L0;
    const back = (d) => [x - ux * d, y - uy * d];
    const gap = c.gap ?? 0.07, len = c.len ?? 2.7;
    const seg = (d0, d1, w0, w1, fill) => {
      const a = back(gap + d0), b = back(gap + d1), nx = -uy, ny = ux;
      const q = [[a[0] + nx * w0, a[1] + ny * w0], [b[0] + nx * w1, b[1] + ny * w1], [b[0] - nx * w1, b[1] - ny * w1], [a[0] - nx * w0, a[1] - ny * w0]];
      return `<polygon points="${q.map(pt).join(" ")}" fill="${fill}" stroke="rgba(0,0,0,.45)" stroke-width="0.005" stroke-linejoin="round"/>`;
    };
    const wT = 0.027 * MODE.line, wB = 0.058 * MODE.line;
    const w = (d) => wT + (wB - wT) * (d / len);
    let s = `<g opacity="${c.op ?? 1}">`;
    s += `<line x1="${f(back(gap)[0])}" y1="${sy(back(gap)[1])}" x2="${f(back(gap + len)[0])}" y2="${sy(back(gap + len)[1])}" stroke="rgba(0,0,0,.25)" stroke-width="${wB * 2.6}" stroke-linecap="round" transform="translate(0.03 0.04)"/>`;
    s += seg(0, 0.03, wT, wT, "#2f5d9a");
    s += seg(0.03, 0.1, wT, w(0.1), "#f4f1e8");
    s += seg(0.1, len * 0.62, w(0.1), w(len * 0.62), "#e8cf9c");
    s += seg(len * 0.62, len * 0.64, w(len * 0.62), w(len * 0.64), "#cfcfcf");
    s += seg(len * 0.64, len, w(len * 0.64), wB, "#3a2417");
    return s + "</g>";
  }
  function badge(x, y, n, col) {
    if (MODE.thumb) return "";
    return `<g${up(x, sy(y))}><circle cx="${f(x)}" cy="${sy(y)}" r="0.085" fill="${col || "#ffffff"}" stroke="rgba(0,25,45,.8)" stroke-width="0.012"/>` +
      `<text x="${f(x)}" y="${f(sy(y) + 0.036)}" font-size="0.105" text-anchor="middle" font-family="'Saira Condensed',Arial Narrow,sans-serif" font-weight="800" fill="#0b1f2e">${esc(n)}</text></g>`;
  }
  function pointAlong(pts, t) {
    const seg = []; let tot = 0;
    for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(l); tot += l; }
    let d = tot * t;
    for (let i = 0; i < seg.length; i++) {
      if (d <= seg[i] || i === seg.length - 1) { const k = seg[i] ? Math.min(1, d / seg[i]) : 0; return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * k, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * k]; }
      d -= seg[i];
    }
    return pts[pts.length - 1];
  }
  const STYLE = {
    cue: { color: "#ffffff", solid: true, w: 0.03 },
    obj: { color: "#ffd23a", solid: false, w: 0.028 },
    alt: { color: "#ffffff", solid: false, w: 0.022, op: 0.85 },
    aim: { color: "#ffffff", solid: false, w: 0.012, op: 0.7, dash: "0.025 0.03", arrow: false },
    blue: { color: "#2a6bff", solid: false, w: 0.028 },
    dark: { color: "#1a1a1a", solid: true, w: 0.03 },
  };
  function path(p, uid) {
    const st = STYLE[p.kind || "cue"] || { color: p.kind, solid: false, w: 0.028 };
    const col = p.color || (p.ball ? COLORS[p.ball > 8 ? p.ball - 8 : p.ball] : st.color);
    const solid = p.solid ?? (p.dash ? false : st.solid);
    let pts = p.pts.slice();
    if (p.curve && pts.length > 2) {
      const q = [pts[0], ...pts, pts[pts.length - 1]], out = [];

<script>

  let docRef = null, sync = 'local', writing = Promise.resolve();

    writing = writing.then(() => docRef.set(body)).catch(e => { if (e && (e.code === 'invalid_argument' || e.code === 'not_granted' || e.code === 'revoked')) { docRef = null; sync = 'local'; } }); };
  const mergeLogs = (a, b) => { const out = {}; for (const k of new Set([...Object.keys(a||{}), ...Object.keys(b||{})])) {
      const m = new Map(); [...(a[k]||[]), ...(b[k]||[])].forEach(e => m.set(e[0], e)); out[k] = [...m.values()].sort((x,y)=>x[0]-y[0]).slice(-40); } return out; };

  const logged = d => lastTs(d) > 0;
  function addScore(d, val){

    prog.logs[k] = [...entries(k), [now, val]].slice(-40); saveLocal(); saveRemote();

  const rerender = art => { const d = byNm.get(art.dataset.name); const ctx = art.dataset.ctx; const tmp = document.createElement('div'); tmp.innerHTML = card(d, ctx, true); art.replaceWith(tmp.firstElementChild); };
  const onClick = e=>{
    if(e.target.closest('[data-act="all"]')){ setMode('all'); window.scrollTo({top:0}); return; }
    const ln = e.target.closest('[data-len]'); if(ln){ sessLen = +ln.dataset.len; store.set('drillbook.len', String(sessLen)); draw(); return; }
    if(e.target.closest('[data-reroll]')){ seed++; draw(); return; }
    const op = e.target.closest('[data-open]');
    if(op){ const d = byNm.get(op.dataset.open); if(!d) return; lastSave = null; document.getElementById('ddt').textContent = d.name; document.getElementById('ddb').innerHTML = card(d, 'd', true); openDlg(dd); dd.scrollTop = 0; return; }
    const sk = e.target.closest('.skill'); if(sk){ if(dd.open) dd.close(); setSkill(sk.dataset.skill); barEl.scrollIntoView({block:'start'}); return; }
    const art = e.target.closest('article.drill'); if(!art) return; const d = byNm.get(art.dataset.name); if(!d) return;
    const pk = e.target.closest('[data-pick]');
    if(pk){ const box = pk.closest('.logbox'); box.querySelectorAll('[data-pick]').forEach(b=>b.setAttribute('aria-pressed', String(b===pk))); box.dataset.val = pk.dataset.pick; box.querySelector('[data-save]').disabled = false; return; }
    if(e.target.closest('[data-undo]')){
      if (lastSave) { const k = lastSave.key; prog.logs[k] = entries(k).filter(x=>x[0]!==lastSave.ts); if (!prog.logs[k].length) delete prog.logs[k]; saveLocal(); saveRemote(); lastSave = null; dirty = true; }
      rerender(art); return;
    }
    if(e.target.closest('[data-save]')){
      const box = art.querySelector('.logbox'), inp = box.querySelector('input'), spec = specOf(d);
      const val = inp ? parseFloat(inp.value) : parseFloat(box.dataset.val);
      if (!Number.isFinite(val) || val < 0 || (spec.max && val > spec.max)) { if (inp) { inp.setCustomValidity(spec.max ? `Enter a score from 0 to ${spec.max}.` : 'Enter a score of 0 or more.'); inp.reportValidity(); } return; }
      if (inp) inp.setCustomValidity('');
      const ts = addScore(d, val); lastSave = { key: keyOf(d), ts, val }; dirty = true; rerender(art); return;
    }
    if(e.target.closest('.zoom') || e.target.closest('.svgwrap')){
      const v = vOf(d); zoomed = d;
      document.getElementById('zt').textContent = d.name + (v ? ' · ' + [v.group, v.label].filter(Boolean).join(' · ') : '');
      drawZoom(); openDlg(zd);
      return;
    }
    const t = e.target.closest('.vt'); if(!t) return;
    d.vi = t.dataset.g!=null ? d.variants.findIndex(v=>v.group===t.dataset.g) : +t.dataset.v;
    rerender(art);
  };
  document.getElementById('main').addEventListener('click', onClick);
  dd.addEventListener('click', onClick);
  document.addEventListener('keydown', e=>{ if(e.key==='Enter' && e.target.matches && e.target.matches('.logbox input')){ const b = e.target.closest('.logbox').querySelector('[data-save]'); if(b) b.click(); } });

  press('[data-view]', 'view', view);
  setMode(mode);
})();
</script>
<script>if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(function(){});</script>
