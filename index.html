<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pool Drill Book</title>
<meta name="description" content="Pool drills in the order you learn them, every table drawn to scale. Log scores, pass drills and get a practice session built for you.">
<meta name="theme-color" content="#f2f4f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101316" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Drill Book">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<style>/* Layout: one toolbar, a section rail on the left, one drill per sheet with the table first. */
:root{
  --paper:#f2f4f3; --sheet:#ffffff; --ink:#14191d; --ink-2:#55606a; --rule:#dde2e3;
  --chalk:#1f62c9; --chalk-soft:#e4ecf9; --rail:#1b1d22; --on-chalk:#ffffff; --good:#157a50; --good-soft:#dff3e8; --on-good:#ffffff;
  --display:'Saira Condensed','Arial Narrow',sans-serif; --body:'Public Sans',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  --r0:#7a52d6; --r1:#2f7de1; --r2:#1ea672; --r3:#e2a316; --r4:#ea6a1f; --r5:#d8322c;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#101316; --sheet:#171b1f; --ink:#e9edef; --ink-2:#9aa5ad; --rule:#2a3137; --chalk:#6ea2ff; --chalk-soft:#1b2a44; --on-chalk:#0b1220; --good:#4fd39a; --good-soft:#123326; --on-good:#06281a; color-scheme:dark}}
:root[data-theme="dark"]{--paper:#101316; --sheet:#171b1f; --ink:#e9edef; --ink-2:#9aa5ad; --rule:#2a3137; --chalk:#6ea2ff; --chalk-soft:#1b2a44; --on-chalk:#0b1220; --good:#4fd39a; --good-soft:#123326; --on-good:#06281a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--body);margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
header.top{display:grid;gap:8px;padding-bottom:18px;position:relative}
h1{font:800 clamp(40px,7vw,68px)/.9 var(--display);letter-spacing:-.01em;margin:0;text-transform:uppercase}
h1 em{font-style:normal;color:var(--chalk)}
.lede{max-width:62ch;color:var(--ink-2);margin:0}

.bar{position:sticky;top:0;z-index:5;background:var(--paper);display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:12px;border-block:1px solid var(--rule)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;background:var(--sheet);padding:3px}
.seg button{font:600 12.5px/1 var(--mono);letter-spacing:.02em;border:0;background:transparent;color:var(--ink-2);padding:8px 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg small{font-weight:500;opacity:.7}
.seg svg{width:14px;height:14px;flex:none}
.bar input,.bar select{font:500 14px var(--body);padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);min-width:0;max-width:100%}
.bar input{flex:1 1 140px}
.filters{display:contents}
.filters select{max-width:190px}
.ftoggle{display:none;position:relative;font:600 12.5px var(--mono);border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:0 12px;cursor:pointer;align-items:center;gap:6px}
.ftoggle svg{width:16px;height:16px}
.ftoggle[aria-expanded="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.ftoggle b{display:none;position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--chalk);color:var(--on-chalk);font:700 10.5px/18px var(--mono);text-align:center;padding:0 4px}
.ftoggle b:not(:empty){display:block}
.clear{font:600 12px var(--mono);border:0;background:transparent;color:var(--chalk);padding:8px 4px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.clear[hidden]{display:none}
.chips{display:none}
.tabbar{display:none}
:is(.seg button,.bar input,.bar select,.ftoggle,.clear,.chips a,.tabbar button,.skill,.vt,.zoom,.toc a,.empty button,.more,summary,.tile,.row,.lbtn,.logbox input,.pick button,.undo,.lenbtn):focus-visible{outline:2px solid var(--chalk);outline-offset:2px}

/* tablets and phones: no section rail, so the sections become a strip of chips under the search bar */
@media (max-width:900px){
  .chips{display:flex;gap:6px;overflow-x:auto;width:100%;scrollbar-width:none;padding:2px 1px;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
  .chips::-webkit-scrollbar{display:none}
  .chips:empty{display:none}
  .chips a{flex:none;display:inline-flex;align-items:center;gap:6px;text-decoration:none;font:600 14px/1 var(--display);letter-spacing:.03em;text-transform:uppercase;color:var(--ink-2);background:var(--sheet);border:1px solid var(--rule);border-radius:999px;padding:8px 12px;white-space:nowrap}
  .chips a b{font:600 10.5px var(--mono);color:var(--chalk)}
  .chips a[aria-current="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .chips a[aria-current="true"] b{color:inherit;opacity:.7}
}
/* phones: modes move to a tab bar at the bottom, the top bar keeps search, layout and filters */
@media (max-width:760px){
  body{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  .wrap{padding-top:20px}
  .bar{gap:8px;padding-block:8px}
  .bar .modes{display:none}
  .bar input,.bar select{font-size:16px;height:40px}
  .bar input{order:-1;flex:1 1 100px}
  .seg.view button{padding:0;width:40px;height:32px}
  .seg.view .vl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .seg.view svg{width:16px;height:16px}
  .ftoggle{display:inline-flex;height:40px}
  .filters{display:none;width:100%;gap:8px;flex-wrap:wrap;align-items:center}
  .filters.open{display:flex}
  .filters select{flex:1 1 140px;max-width:none}
  .tabbar{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--sheet);border-top:1px solid var(--rule);padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
  .tabbar button{all:unset;box-sizing:border-box;display:grid;justify-items:center;align-content:center;gap:3px;min-height:58px;cursor:pointer;color:var(--ink-2);font:600 11px/1 var(--mono);letter-spacing:.02em;-webkit-tap-highlight-color:transparent}
  .tabbar button svg{width:22px;height:22px}
  .tabbar button[aria-pressed="true"]{color:var(--chalk)}
  .tabbar button[aria-pressed="true"] svg{stroke-width:2.2}
  .tabbar small{font:500 10px var(--mono);opacity:.75}
}

details.legend{margin-top:12px;color:var(--ink-2);font:500 12.5px var(--mono)}
details.legend summary{cursor:pointer;width:max-content;max-width:100%}
.legend-row{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:10px}
.legend-row span{display:inline-flex;align-items:center;gap:7px}
.sw{display:inline-grid;place-items:center;width:44px;height:22px;border-radius:5px;background:#1597d4}
.sw svg{width:40px;height:18px}
.tablerow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.tablerow select{font:500 14px var(--body);padding:7px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);max-width:100%}

.layout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:34px;margin-top:24px}
.layout.solo{grid-template-columns:minmax(0,1fr)}
.layout.solo .toc{display:none}
.toc{position:sticky;top:calc(var(--barh,62px) + 14px);align-self:start;display:grid;gap:1px}
.toc a[aria-current="true"]{background:var(--chalk-soft);color:var(--ink)}
.toc a{display:grid;grid-template-columns:22px 1fr auto;gap:6px;align-items:baseline;text-decoration:none;color:var(--ink-2);padding:6px 8px;border-radius:6px;font:600 15px/1.2 var(--display);letter-spacing:.02em;text-transform:uppercase}
.toc a span:first-child{font:600 11px var(--mono);color:var(--chalk)}
.toc a small{font:500 11px var(--mono)}
.toc a:hover{background:var(--chalk-soft);color:var(--ink)}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}.toc{display:none}}

section.sec{display:grid;gap:16px;margin-bottom:40px;scroll-margin-top:calc(var(--barh,62px) + 14px)}
@media (max-width:760px){
  header.top{gap:6px;padding-bottom:14px}
  .lede{font-size:14px}
  .layout{margin-top:16px}
  section.sec{gap:12px;margin-bottom:30px}
  .sec-num{font-size:44px}
  .sec-head h2{font-size:25px}
  .sec-head p{font-size:14px}
}
.sec-head{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;align-items:end;padding-bottom:4px}
.sec-num{font:800 52px/.8 var(--display);color:var(--chalk);grid-row:span 2;align-self:start;padding-top:2px}
.sec-head h2{font:800 28px/1 var(--display);text-transform:uppercase;margin:0;letter-spacing:.01em;text-wrap:balance}
.sec-head p{margin:0;color:var(--ink-2);max-width:66ch}

.drill{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);overflow:hidden}
@media (max-width:760px){.drill{grid-template-columns:minmax(0,1fr)}}
.board{background:var(--rail);padding:10px;display:flex;flex-direction:column;justify-content:center;gap:8px;position:relative}
.board svg{display:block;width:100%;height:auto}
.svgwrap{cursor:zoom-in;aspect-ratio:9/5;border-radius:6px}
.svgwrap:empty{background:#1597d4;box-shadow:inset 0 0 0 14px #17191d}
.svgwrap svg{height:100%}
.zoom{position:absolute;top:14px;right:14px;z-index:2;width:32px;height:32px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(10,14,18,.55);color:#fff;cursor:pointer;display:grid;place-items:center;padding:0}
.zoom:hover{background:rgba(10,14,18,.8)}
.zoom svg{width:16px;height:16px}
.vtabs{display:grid;gap:6px}
.vrow{display:flex;flex-wrap:wrap;gap:5px}
.vt{font:600 11.5px/1 var(--mono);letter-spacing:.03em;padding:7px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:transparent;color:#d4dbe0;cursor:pointer;min-width:30px}
.vt[aria-pressed="true"]{background:#fff;color:#111;border-color:#fff}
.vnote{font:500 12.5px/1.45 var(--body);color:#d6dde2;margin:0}
@media (max-width:760px){.board{padding:6px}.zoom{top:12px;right:12px;width:38px;height:38px}.txt{padding:14px 16px 16px}.txt h3{font-size:21px}.vtabs{padding:2px 2px 4px}}
@media (pointer:coarse){.vt{min-height:36px;min-width:40px;font-size:12.5px}.skill{padding:7px 10px}.skill.main{padding:8px 11px}}

.txt{padding:18px 20px;display:grid;gap:10px;align-content:start;min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px}
.txt h3{font:700 23px/1.05 var(--display);margin:0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.meter{display:inline-flex;align-items:center;gap:7px;font:600 11px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.meter .bars{display:inline-grid;grid-template-columns:repeat(6,6px);gap:2px}
.meter .bars i{height:9px;border-radius:2px;background:var(--rule)}
.skills{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.skill{font:600 11px/1 var(--mono);padding:5px 8px;border-radius:5px;border:0;background:var(--chalk-soft);color:var(--chalk);cursor:pointer}
.skill.main{background:var(--chalk);color:var(--on-chalk);font-size:11.5px;padding:6px 9px}
.skill:hover{outline:1px solid var(--chalk)}
.rec{font:600 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--good);margin-left:4px}
.passed{display:inline-flex;align-items:center;gap:4px;font:600 10.5px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--good);background:var(--good-soft);border-radius:5px;padding:4px 7px}
.passed svg{width:11px;height:11px}
.purpose{margin:0;font-weight:500}
.txt ol{margin:0;padding-left:20px;color:var(--ink-2);display:grid;gap:5px}
.txt ol li::marker{font:600 12px var(--mono);color:var(--chalk)}
.score{margin:0;font-size:13.5px}
.score b{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-right:6px}
.tipbox{display:flex;align-items:center;gap:10px}
.tipbox svg{width:46px;height:46px;flex:none}
.tipbox span{font:500 12px var(--mono);color:var(--ink-2)}

.logbox{border-top:1px solid var(--rule);padding-top:12px;display:grid;gap:8px}
.lb-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;align-items:baseline}
.lb-head b{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.lb-head span{font-size:12.5px;color:var(--ink-2)}
.lb-entry{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.logbox input{width:76px;font:600 15px var(--mono);padding:7px 8px;border:1px solid var(--rule);border-radius:7px;background:var(--paper);color:var(--ink);font-variant-numeric:tabular-nums}
.lbtn{font:600 12.5px var(--mono);border:1px solid var(--chalk);background:var(--chalk);color:var(--on-chalk);border-radius:7px;padding:8px 12px;cursor:pointer}
.lb-hist{display:flex;flex-wrap:wrap;gap:5px}
.lb-hist span{font:500 11.5px var(--mono);padding:4px 7px;border-radius:5px;background:var(--paper);border:1px solid var(--rule);color:var(--ink-2);font-variant-numeric:tabular-nums}
.lb-hist span.ok{border-color:var(--good);color:var(--good)}
.lb-status{margin:0;font-size:13px;color:var(--ink)}
.pick{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:4px;max-width:480px}
@media (max-width:760px){.pick{grid-template-columns:repeat(var(--m),minmax(0,1fr));gap:6px}}
.pick button{font:600 13px/1 var(--mono);height:34px;padding:0;border-radius:7px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.pick button.ok{border-color:color-mix(in srgb,var(--good) 55%,var(--rule))}
.pick button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.lbtn:disabled{opacity:.45;cursor:default}
.undo{font:600 12px var(--mono);border:0;background:transparent;color:var(--chalk);padding:4px 2px;margin-left:4px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
@media (pointer:coarse),(max-width:760px){.pick button{height:42px;font-size:15px}.lbtn{min-height:42px;padding:0 16px}.logbox input{height:42px;font-size:16px;width:90px}.undo{padding:8px 4px}}

/* grid view */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px}
.tile{all:unset;box-sizing:border-box;display:grid;grid-template-rows:auto 1fr;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;overflow:hidden;cursor:pointer;min-width:0}
.tile:hover{border-color:var(--chalk)}
.thumb{background:var(--rail);display:block;aspect-ratio:8.72/4.72;overflow:hidden}
.thumb:empty{background:#1597d4;box-shadow:inset 0 0 0 7px #17191d}
.thumb svg{display:block;width:100%;height:100%}
.tile .thumb{border-bottom:1px solid var(--rule)}
.tile .tt{padding:10px 12px 12px;display:grid;gap:6px;align-content:start;min-width:0}
@media (max-width:600px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile .tt{padding:8px 10px 10px;gap:5px}.tile h3{font-size:15px}.tile .meter{font-size:10px}.tile .tag1{font-size:10px}}
.tile h3,.row h3{font:700 17px/1.1 var(--display);text-transform:uppercase;letter-spacing:.01em;margin:0;text-wrap:balance}
.tagrow{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tag1{font:600 10.5px/1 var(--mono);padding:4px 7px;border-radius:5px;background:var(--chalk-soft);color:var(--chalk)}
/* list view */
.rows{display:grid;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.row{all:unset;box-sizing:border-box;display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:14px;align-items:center;padding:8px 14px 8px 8px;cursor:pointer;border-top:1px solid var(--rule)}
.row:first-child{border-top:0}
.row:hover{background:var(--chalk-soft)}
.row .thumb{border-radius:6px}
.row .rt{display:grid;gap:4px;min-width:0}
.row .rp{margin:0;font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rside{display:grid;gap:6px;justify-items:end}
@media (max-width:600px){.row{grid-template-columns:118px minmax(0,1fr);gap:5px 12px;padding:8px 12px 8px 8px}.row .thumb{grid-row:span 2;align-self:center}.row .rside{grid-column:2;justify-items:start;align-self:start;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}.row .rt{align-self:end}.row h3{font-size:16px}.row .rp{display:none}}

#tip{position:fixed;z-index:30;pointer-events:none;background:var(--ink);color:var(--paper);font:600 12px/1.3 var(--mono);padding:6px 8px;border-radius:6px;white-space:nowrap;opacity:0;transform:translate(-50%,-100%);transition:opacity .1s}
#tip.on{opacity:1}
/* pages without the library hide its search, layouts, filters and legend */
body:not(.m-library) :is(.bar .view,#q,.ftoggle,.filters,.chips,details.legend,.lede){display:none}
@media (max-width:760px){body:not(.m-library) .bar{display:none}}
@media (max-height:500px){.bar{position:static}}
@media (pointer:coarse),(max-width:760px){.pick button{height:44px}.undo{min-height:44px}.lbtn{min-height:44px}}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.empty{display:grid;gap:12px;justify-items:start;color:var(--ink-2);padding:28px 0}
.empty p{margin:0}
.empty button,.more{font:600 13px var(--mono);border:1px solid var(--chalk);background:var(--chalk);color:var(--on-chalk);border-radius:8px;padding:9px 14px;cursor:pointer}
.more{background:transparent;color:var(--chalk)}

dialog#dd{border:0;border-radius:12px;padding:0;width:min(1120px,96vw);max-height:94vh;background:var(--paper);color:var(--ink)}
dialog#dd::backdrop{background:rgba(5,8,12,.6)}
.ddhead{display:flex;justify-content:flex-end;padding:10px 12px 0}
.ddhead button{font:600 12px var(--mono);border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer}
.ddbody{padding:10px 12px 12px}
dialog#zoomd{border:0;border-radius:12px;padding:0;width:min(1200px,96vw);max-height:94vh;background:var(--rail);color:#fff;box-shadow:0 20px 60px rgba(0,0,0,.5)}
dialog#zoomd::backdrop{background:rgba(5,8,12,.72)}
.zhead{display:flex;align-items:center;gap:12px;padding:12px 16px}
.zhead h3{font:700 22px/1.1 var(--display);text-transform:uppercase;margin:0;flex:1;letter-spacing:.01em}
.zhead button{font:600 12px var(--mono);border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}
.zbody{padding:0 14px 14px;display:grid;place-items:center}
.zbody svg{display:block;width:100%;height:auto;max-height:calc(94vh - 76px)}
body:has(dialog[open]){overflow:hidden}
@media (max-height:520px){
  dialog#zoomd{width:100%;max-width:100%;height:100%;max-height:100%;margin:0;border-radius:0;display:none;flex-direction:column}
  dialog#zoomd[open]{display:flex}
  .zhead{padding:6px 12px}.zhead h3{font-size:16px}
  .zbody{flex:1;min-height:0;padding:0 8px 8px}
  .zbody svg{width:100%;height:100%;max-height:100%}
}
@media (max-width:760px){
  dialog#dd,dialog#zoomd{width:100%;max-width:100%;height:100%;max-height:100%;margin:0;border-radius:0}
  .ddhead{position:sticky;top:0;z-index:3;background:var(--paper);padding:10px 12px;border-bottom:1px solid var(--rule);justify-content:space-between;align-items:center;gap:10px}
  .ddhead span{font:700 17px/1.1 var(--display);text-transform:uppercase;letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ddhead button,.zhead button{min-height:40px;padding:0 16px;font-size:13px}
  .ddbody{padding:10px 10px calc(16px + env(safe-area-inset-bottom,0px))}
  .ddbody .drill{border-radius:10px}
  dialog#zoomd{display:none;flex-direction:column}
  dialog#zoomd[open]{display:flex}
  .zhead{padding:10px 12px}
  .zhead h3{font-size:18px}
  .zbody{flex:1;min-height:0;padding:0 8px calc(8px + env(safe-area-inset-bottom,0px));display:grid;place-items:center}
  .zbody svg{width:100%;height:100%;max-height:100%}
}
@media (min-width:761px){.ddhead span{display:none}}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}

/* sharing: the Share button, the link buttons on cards, the copied toast and the copy-by-hand box */
.share-top{position:absolute;top:0;right:0;font:600 12.5px var(--mono);border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:0 12px;min-height:38px;display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.share-top svg{width:16px;height:16px}
.share-top:hover{border-color:var(--chalk);color:var(--chalk)}
.drill .head{position:relative}
.cshare{flex:none;width:34px;height:34px;border-radius:8px;border:1px solid var(--rule);background:transparent;color:var(--ink-2);cursor:pointer;display:inline-grid;place-items:center;padding:0;margin-left:auto}
.cshare svg{width:16px;height:16px}
.cshare:hover{color:var(--chalk);border-color:var(--chalk)}
.ddhead .ddbtns{display:flex;gap:8px;margin-left:auto}
#toast{position:fixed;left:50%;bottom:24px;z-index:40;transform:translate(-50%,12px);background:var(--ink);color:var(--paper);font:600 13px var(--mono);padding:10px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
#toast.on{opacity:1;transform:translate(-50%,0)}
dialog#linkd{border:1px solid var(--rule);border-radius:12px;padding:16px;width:min(520px,92vw);background:var(--sheet);color:var(--ink)}
dialog#linkd::backdrop{background:rgba(5,8,12,.55)}
#linkd p{margin:0 0 10px;font-weight:600}
#linkd input{width:100%;font:500 13px var(--mono);padding:10px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink)}
#linkd div{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
#linkd button{font:600 12.5px var(--mono);border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:0 14px;min-height:40px;cursor:pointer}
#linkd button#lcopy{background:var(--chalk);border-color:var(--chalk);color:var(--on-chalk)}
:is(.share-top,.cshare,#linkd button):focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
@media (max-width:760px){
  #toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .share-top{min-height:44px}
  .cshare{width:44px;height:44px}
}
@media (max-width:520px){
  header.top h1{padding-right:56px}
  .share-top{width:44px;padding:0;justify-content:center}
  .share-top span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
}

/* ---------- the Routine page ----------
   Drawn like the rest of the book: white sheets with thin rules, blue numbers, condensed titles, mono labels.
   One color for the page; the only other two are the sides of the table, left and right. */
:root{--side-0:#0b7285; --side-1:#b03a63}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--side-0:#4cc3d6; --side-1:#f27fa7}}
:root[data-theme="dark"]{--side-0:#4cc3d6; --side-1:#f27fa7}

/* the header steps back on pages without the library */
body:not(.m-library) header.top{padding-bottom:12px}
body:not(.m-library) header.top h1{font-size:clamp(30px,5vw,44px)}
body:not(.m-library) .layout{margin-top:20px}

section.rt{display:grid;gap:14px;min-width:0}
.kl{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);display:block}
/* a label row, like YOUR SCORES on a drill card */
.kh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 10px}
.kh b{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.kh span{font:500 12px var(--mono);color:var(--ink-2)}
.side{display:inline-flex;align-items:center;font:600 10.5px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:4px 7px;border-radius:5px;white-space:nowrap;color:var(--side-0);background:color-mix(in srgb,var(--side-0) 13%,transparent)}
.side.s1{color:var(--side-1);background:color-mix(in srgb,var(--side-1) 13%,transparent)}

/* ---------- overview ---------- */
.rt-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.rt-h{font:800 28px/1 var(--display);text-transform:uppercase;letter-spacing:.01em;margin:0}
.rt-sub{margin:6px 0 0;font:500 12.5px var(--mono);color:var(--ink-2)}
.lens button small{font-weight:500;opacity:.7}
.rbs{list-style:none;margin:0;padding:0;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.rb + .rb{border-top:1px solid var(--rule)}
.rb-head{all:unset;box-sizing:border-box;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;padding:13px 16px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.rb-head:hover{background:var(--chalk-soft)}
.rb-n{font:800 30px/.8 var(--display);color:var(--chalk);text-align:center}
.rb-n svg{width:22px;height:22px;color:var(--good);vertical-align:middle}
.rb-t{display:grid;gap:4px;min-width:0}
.rb-t b{font:700 19px/1.1 var(--display);text-transform:uppercase;letter-spacing:.01em}
.rb-s{font:500 12px var(--mono);color:var(--ink-2);font-variant-numeric:tabular-nums}
.rb-c{color:var(--ink-2);opacity:.6;display:grid}
.rb-c svg{width:16px;height:16px}
.rb-go{font:600 12px/1 var(--mono);letter-spacing:.04em;text-transform:uppercase;background:var(--ink);color:var(--paper);border-radius:999px;padding:9px 14px}
.rb.next{box-shadow:inset 3px 0 0 var(--chalk)}
.rb.done .rb-t b{color:var(--ink-2)}
.rt-done{display:flex;gap:10px;align-items:flex-start;margin:0;padding:12px 14px;border-radius:10px;background:var(--good-soft);font-size:14px}
.rt-done svg{width:18px;height:18px;flex:none;color:var(--good);margin-top:2px}
.rt-done b{font-weight:600}
.rt-more{display:grid;gap:4px;justify-items:start}
.sync{margin:6px 0 0;font:500 12px var(--mono);color:var(--ink-2)}

/* folded boxes: a mono line you tap, like Table and legend */
details.fold > summary{cursor:pointer;font:500 12.5px var(--mono);color:var(--ink-2);min-height:36px;display:flex;align-items:center;gap:8px;width:max-content;max-width:100%;list-style:none}
details.fold > summary::-webkit-details-marker{display:none}
details.fold > summary::before{content:"";width:0;height:0;border-left:6px solid currentColor;border-block:4px solid transparent;transition:transform .12s}
details.fold[open] > summary::before{transform:rotate(90deg)}
.fold-b{display:grid;gap:10px;font-size:14px;padding:4px 0 10px}
.fold-b p{margin:0}
.fold-b h4{margin:6px 0 0;font:700 17px/1.1 var(--display);text-transform:uppercase;letter-spacing:.01em}
.rt-more details.fold{width:100%}
.rt-more .fold-b{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:14px 16px}
ol.rules,ol.howto,.focus{margin:0;padding-left:22px;display:grid;gap:6px;color:var(--ink-2)}
ol.rules li::marker,ol.howto li::marker{font:600 12px var(--mono);color:var(--chalk)}
ol.rules li b{color:var(--ink);font-weight:600}

/* ---------- a block's page ---------- */
.rt-block{gap:12px}
.bp-back{justify-self:start;display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--chalk);font:600 12.5px var(--mono);padding:0 6px 0 0;min-height:36px;cursor:pointer}
.bp-back svg{width:14px;height:14px}
.bp-head .sec-num svg{width:38px;height:38px;color:var(--good)}
.bp-head p{font:500 12.5px var(--mono)}
.bp-sheet{align-items:start}
.bp-board{align-self:stretch;justify-content:flex-start;gap:4px}
.bp-board .svgwrap{aspect-ratio:auto;min-height:60px}
.bp-board .svgwrap svg{height:auto}
.bp-foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bp-foot .zoom{position:static}
.rb-tag{font:600 11.5px/1 var(--mono);letter-spacing:.03em;color:#d4dbe0;border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:7px 10px}
/* setup screen: numbered steps, each a row of pictures */
.rt-setup{gap:12px}
.step-h{margin-top:10px;padding-top:12px;border-top:1px solid var(--rule)}
.step-h b{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--ink)}
.step-h b i{font:800 15px/1 var(--display);font-style:normal;color:var(--on-chalk);background:var(--chalk);width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;letter-spacing:0}
.lvc{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:10px}
.lvcard{all:unset;box-sizing:border-box;display:grid;grid-template-rows:auto 1fr;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent}
.lvcard:hover{border-color:var(--chalk)}
.lvcard.on{border:2px solid var(--chalk);box-shadow:0 0 0 3px var(--chalk-soft)}
.lvcard .thumb{border-bottom:1px solid var(--rule)}
.lvc-t{display:grid;gap:3px;padding:9px 11px 11px}
.lvc-t small{font:600 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.lvc-t small em{font-style:normal;color:var(--good)}
.lvc-t b{font:700 16px/1.1 var(--display);text-transform:uppercase;letter-spacing:.01em}
.lvcard.on .lvc-t{background:var(--chalk-soft)}
.pics{display:grid;gap:12px}
.pics.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.pic{margin:0;display:grid;gap:6px;min-width:0}
.pic .board{border-radius:10px}
.pic .svgwrap{aspect-ratio:auto;cursor:zoom-in}
.pic .svgwrap svg{height:auto}
.pic figcaption{display:flex;gap:8px;align-items:center}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:8px}
.shot{all:unset;box-sizing:border-box;display:grid;grid-template-rows:auto 1fr;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;overflow:hidden;cursor:zoom-in}
.shot:hover{border-color:var(--chalk)}
.shot-t{display:flex;align-items:center;gap:6px;padding:6px 8px;font:600 11.5px/1.25 var(--mono);color:var(--ink)}
.shot-t small{font-weight:500;color:var(--ink-2);white-space:nowrap}
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--side-0)}
.dot.s1{background:var(--side-1)}
.startbar{position:sticky;bottom:0;z-index:4;display:flex;gap:8px;padding:10px 0 12px;margin-top:4px;background:var(--paper);border-top:1px solid var(--rule)}
.startbar .go{flex:1}
.ghostbtn{font:600 13px var(--mono);letter-spacing:.02em;min-height:50px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);cursor:pointer;padding:0 16px}
.ghostbtn:hover{border-color:var(--ink-2)}
.ghostbtn.small{min-height:36px;font-size:12px;justify-self:start;margin-top:6px}
/* training screen: the shot and nothing else */
.rt-train{gap:10px}
.tr-top{display:flex;align-items:center;gap:12px}
.tr-name{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;font:700 19px/1.1 var(--display);text-transform:uppercase;letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr-name span{font-weight:800;color:var(--chalk)}
.tr-n{font:600 13px var(--mono);color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.rt-train > .pbar{margin:0}
.tr-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(260px,1fr);gap:14px;align-items:start}
.tr-grid .board{border-radius:10px}
.tr-side{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:16px;align-content:start}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:16px 20px}
.rt-done-pane .sheet{max-width:640px;display:grid;gap:12px}
.kh b svg{width:13px;height:13px;vertical-align:-2px;margin-right:5px;color:var(--good)}
.fin-btns{display:grid;grid-template-columns:1fr auto auto;gap:8px}
table.spots{border-collapse:collapse;width:100%;font:500 14px var(--body);font-variant-numeric:tabular-nums}
table.spots th[scope="row"]{text-align:left;font-weight:400;color:var(--ink-2);padding:8px 10px 8px 0;vertical-align:top}
table.spots td{padding:8px 10px 8px 0;font-weight:600;vertical-align:top}
table.spots tr + tr > *{border-top:1px solid var(--rule)}
table.spots thead th{text-align:left;padding:0 10px 6px 0}
table.spots thead + tbody tr:first-child > *{border-top:1px solid var(--rule)}
table.spots.two td{width:30%}
table.spots tr.grp th{padding:12px 0 6px;text-align:left}
.setup-p{margin:0;font-size:14.5px}
.go{width:100%;font:600 13.5px var(--mono);letter-spacing:.03em;min-height:50px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;padding:0 16px}
.go:hover{opacity:.9}
details.howplay{border-top:1px solid var(--rule);padding-top:4px}
details.howplay .fold-b{color:var(--ink)}
.howplay b{font-weight:600}
.focus li::marker{color:var(--chalk)}
.rel{display:flex;flex-wrap:wrap;gap:6px}
.rel button{font:600 12px var(--mono);border:1px solid var(--rule);background:var(--paper);color:var(--chalk);border-radius:7px;padding:0 10px;min-height:36px;cursor:pointer}
.steps10{margin:0;padding:9px 11px 9px 34px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);columns:2;column-gap:22px;font-size:13.5px}
.steps10 li{break-inside:avoid;padding:1px 0}
.steps10 li::marker{font:600 12px var(--mono);color:var(--chalk)}
/* practice: one shot */
.now{display:grid;gap:12px}
.now-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.pbar{height:3px;border-radius:2px;background:var(--rule);overflow:hidden;margin-top:-4px}
.pbar i{display:block;height:100%;background:var(--chalk)}
.now-t{font:700 28px/1.05 var(--display);text-transform:uppercase;letter-spacing:.01em;margin:0;text-wrap:balance}
.now-t.long{font-size:23px}
.now-s{margin:-6px 0 0;color:var(--ink-2)}
.dk-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dk-btns.one{grid-template-columns:1fr}
.dk-btn{font:600 14px var(--mono);letter-spacing:.04em;text-transform:uppercase;min-height:64px;border-radius:8px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:9px;-webkit-tap-highlight-color:transparent}
.dk-btn svg{width:15px;height:15px}
.dk-btn.ok{background:var(--good);border-color:var(--good);color:var(--on-good)}
.dk-btn.no:hover{border-color:var(--ink-2)}
.dk-btn:active{transform:translateY(1px)}
.back{margin:-4px 0 0;font:500 12.5px var(--mono);color:var(--ink)}
.now-f{display:flex;align-items:center;gap:6px 14px;font:500 12px var(--mono);color:var(--ink-2);border-top:1px solid var(--rule);padding-top:6px}
.now-f span{flex:1}
.now-f .undo{margin:0;padding:0 2px;min-height:36px}
/* done */
.fin .now-t{font:800 56px/1 var(--display);display:flex;align-items:baseline;gap:4px}
.fin .now-t small{font-size:28px;color:var(--ink-2)}
.fin .now-t em{font:600 15px var(--mono);font-style:normal;color:var(--ink-2);margin-left:auto}
.fin .now-t em.ok{color:var(--good)}
.lr{margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px;font:600 13px var(--mono);font-variant-numeric:tabular-nums}
.lr > span:empty{width:10px}
.climb{margin:0;font-size:14px;color:var(--ink-2)}
.dk-today{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.dk-today > span:not(.side){font:500 11.5px var(--mono);padding:4px 7px;border-radius:5px;background:var(--paper);border:1px solid var(--rule);color:var(--ink-2);font-variant-numeric:tabular-nums}
.dk-today > span b{font-weight:600;color:var(--ink)}
.dk-today > span.miss{border-color:color-mix(in srgb,var(--ink-2) 55%,var(--rule))}
.cbars{display:grid;gap:6px}
.cbars svg{display:block;width:100%;height:100px}
.cbars small,.sides small{font-size:12.5px;color:var(--ink-2)}
.cbars .side{justify-self:start}
.sides{display:grid;gap:8px}
.sd{display:grid;grid-template-columns:52px minmax(0,1fr) 44px;gap:10px;align-items:center}
.sd .side{justify-content:center}
.sd-bar{height:6px;border-radius:3px;background:var(--rule);overflow:hidden}
.sd-bar i{display:block;height:100%;background:var(--side-0)}
.sd.s1 .sd-bar i{background:var(--side-1)}
.sd b{font:600 12.5px var(--mono);text-align:right}
:is(.lens button,.rb-big,.go,.dk-btn,.lv,.bp-back,.rel button,details.fold > summary):focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
.rb-head:focus-visible{outline:2px solid var(--chalk);outline-offset:-2px}

/* progress, inside its fold */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{display:grid;gap:5px;align-content:start;min-width:0}
.kpi.wide{grid-column:1/-1;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:8px 28px;border-top:1px solid var(--rule);padding-top:12px}
.kpi.wide > div{display:grid;gap:6px;align-content:start;min-width:0}
.kpi b{font:800 34px/1 var(--display);font-variant-numeric:tabular-nums}
.kpi > small{font-size:12.5px;color:var(--ink-2)}
.strip{display:grid;grid-template-columns:repeat(14,minmax(0,22px));gap:4px;margin-top:2px}
.strip i{aspect-ratio:1;border-radius:3px;background:var(--rule)}
.strip i.on{background:var(--chalk)}
.strip i.today{box-shadow:0 0 0 1.5px var(--sheet),0 0 0 3px var(--ink-2)}
.tchart svg{display:block;width:100%;height:96px;overflow:visible}

@media (max-width:760px){
  .rt-head{align-items:stretch;flex-direction:column}
  .lens{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
  .lens button{min-height:40px}
  .rb-head{padding:12px 14px;gap:12px;grid-template-columns:28px minmax(0,1fr) auto}
  .rb-n{font-size:27px}
  .rb-t b{font-size:18px}
  .bp-head{gap:2px 12px}
  .bp-sheet .txt{padding:14px 16px 16px}
  .bp-board{padding:6px}
  .bp-foot .zoom{width:36px;height:36px}
  .now-t{font-size:26px}
  .now-t.long{font-size:22px}
  .steps10{columns:1}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi.wide{grid-template-columns:minmax(0,1fr);gap:14px}
}
@media (pointer:coarse){.dk-btn{min-height:68px}}
@media (max-width:900px){.tr-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  /* training: the page header steps aside, the table runs edge to edge */
  body.rt-focus:not(.m-library) header.top{display:none}
  body.rt-focus:not(.m-library) .wrap{padding-top:8px}
  body.rt-focus:not(.m-library) .layout{margin-top:0}
  .tr-grid{gap:10px}
  .tr-grid .board{margin:0 -16px;border-radius:0;padding:4px}
  .tr-side{padding:12px 14px}
  .pics.two{grid-template-columns:minmax(0,1fr)}
  .pic .board{margin:0 -16px;border-radius:0;padding:4px}
  .lvc{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .lvc-t{padding:7px 9px 9px}
  .lvc-t b{font-size:14.5px}
  .shots{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .shot-t{font-size:10.5px;padding:5px 6px}
  .startbar{bottom:calc(58px + env(safe-area-inset-bottom,0px))}
  .fin-btns{grid-template-columns:1fr 1fr}
  .fin-btns .go{grid-column:1/-1}
}
/* a side tag on the dark rail */
.board .side{color:#fff;background:var(--side-0)}

</style>

<script>(function (root) {
  const IN = 1 / 12.5;
  const G = {
    L: 8, W: 4,
    ballR: 2.25 / 2 * IN,
    cushion: 2.0 * IN,
    railTop: 4.0 * IN,
    sight: (3 + 11 / 16) * IN,
    rowStep: 2.25 * IN * Math.sqrt(3) / 2,
    footSpot: [2, 2], headSpot: [6, 2], center: [4, 2], headString: 6,

  const COLORS = {
    1: "#f3c21b", 2: "#1d4fc4", 3: "#d52b2b", 4: "#6a2ea3", 5: "#f2711c",
    6: "#178a43", 7: "#7b2414", 8: "#141414",

  const PATH = { obj: "#ffd23a", cue: "#ffffff", alt: "#ff5a4f", blue: "#2a6bff", dark: "#1a1a1a" };

  const JAW = { corner: 142, side: 104 };
  const TABLES = {
    wpa: { name: "Standard 9 ft", short: "Standard",
      corner: { mouth: 4.5, jaw: 142, shelf: 1.5 }, side: { mouth: 5.0, jaw: 104, shelf: 0.25 }, },
    predator: { name: "Predator Apex 9 ft", short: "Predator Apex",
      corner: { mouth: 4.25, throat: 3.82, shelf: 1.25 }, side: { mouth: 4.92, throat: 4.13, shelf: 0.25 }, },
    diamond: { name: "Diamond Pro-Am, Pro Cut", short: "Diamond Pro Cut",
      corner: { mouth: 4.4375, jaw: 141, shelf: 1.75 }, side: { mouth: 5.0625, jaw: 102, shelf: 0.25 }, },
    brunswick: { name: "Brunswick Gold Crown VI Tournament", short: "Gold Crown VI",
      corner: { mouth: 4.5, jaw: 142, shelf: 1.5 }, side: { mouth: 5.0, jaw: 104, shelf: 0.25 }, },
    rasson: { name: "Rasson Victory II Plus", short: "Rasson Victory II",
      corner: { mouth: 4.5, jaw: 142, shelf: 1.5 }, side: { mouth: 5.0, jaw: 104, shelf: 0.25 }, },
    rasson4: { name: "Rasson pro setup, 4 in corners", short: "Rasson 4 in",

  let current = "wpa";
  function resolve(t) {

    s += `<rect x="${f(-G.cushion - 0.06)}" y="${f(-G.cushion - 0.06)}" width="${f(G.L + 2 * G.cushion + 0.12)}" height="${f(G.W + 2 * G.cushion + 0.12)}" rx="0.06" fill="${o.railInner || o.rail}"/>`;
    s += `<polygon points="${P.bed.map(pt).join(" ")}" fill="${o.cloth}"/>`;
    if (o.clothShade) s += `<rect x="0" y="0" width="${G.L}" height="${G.W}" fill="url(#${o.clothShade})"/>`;

      let g = "";
      for (let x = 0.5; x < G.L; x += 0.5) g += `M${x} 0V${G.W}`;
      for (let y = 0.5; y < G.W; y += 0.5) g += `M0 ${y}H${G.L}`;
      s += `<path d="${g}" stroke="${o.gridColor}" stroke-width="0.008" fill="none"/>`;
    }
    for (const p of P.cush) s += `<polygon points="${p.map(pt).join(" ")}" fill="${o.cushion}" stroke="${o.nose}" stroke-width="0.01" stroke-linejoin="miter"/>`;
    s += `<line x1="${G.headString}" y1="0" x2="${G.headString}" y2="${G.W}" stroke="${o.line}" stroke-width="0.012"/>`;
    for (const sp of [G.footSpot, G.headSpot, G.center])
      s += `<circle cx="${sp[0]}" cy="${sy(sp[1])}" r="0.025" fill="${o.spot}"/>`;
    const off = G.sight;
    const dia = (x, y) => `<path d="M${f(x)} ${f(sy(y) - 0.045)}l0.03 0.045l-0.03 0.045l-0.03 -0.045Z" fill="${o.sightColor}"/>`;
    for (let x = 1; x < G.L; x++) if (x !== 4)
      for (const y of [-off, G.W + off]) s += dia(x, y);
    for (let y = 1; y < G.W; y++) for (const x of [-off, G.L + off]) s += dia(x, y);
    return s;
  }
  const GENERIC = { s: "#5b5f6b", x: "#a99bc4" };
  let PORTRAIT = false;
  const MODE = { thumb: false, line: 1, ball: 1, text: 1 };
  const tk = (w) => 1 + (MODE.text - 1) * w;
  const up = (x, y) => (PORTRAIT ? ` transform="rotate(-90 ${f(x)} ${f(y)})"` : "");
  function ball(n, x, y, opts = {}) {
    const r = opts.r || G.ballR, cx = f(x), cy = sy(y), sh = opts.shade;
    const faint = opts.faint;
    const op = (faint ? ' opacity="0.5"' : "") + up(cx, cy);
    const edge = `stroke="#151515" stroke-width="0.007"${faint ? ' stroke-dasharray="0.025 0.016"' : ""}`;
    const gloss = sh && !faint ? `<circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#${sh})"/>` : "";

      return `<g${op}><circle cx="${cx}" cy="${cy}" r="${r}" fill="#fbfbf6"/>${gloss}<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" ${edge}/></g>`;
    }
    const num = n === "s" || n === "x" ? 0 : +n;
    const stripe = n === "s" || num > 8;
    const base = n === "s" ? GENERIC.s : n === "x" ? GENERIC.x : COLORS[num > 8 ? num - 8 : num];
    let s = `<g${op}>`;
    if (stripe) {
      s += `<clipPath id="cp${opts.uid}"><circle cx="${cx}" cy="${cy}" r="${r}"/></clipPath>`;
      s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#fbfbf6"/>`;
      s += `<rect x="${f(x - r)}" y="${f(cy - r * 0.6)}" width="${f(2 * r)}" height="${f(r * 1.2)}" fill="${base}" clip-path="url(#cp${opts.uid})"/>`;
    } else {
      s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${base}"/>`;
    }
    if (num && !MODE.thumb) {
      s += `<circle cx="${cx}" cy="${cy}" r="${f(r * 0.52)}" fill="#fbfbf6"/>`;
      s += `<text x="${cx}" y="${f(cy + r * 0.2)}" font-size="${f(r * (num > 9 ? 0.56 : 0.66))}" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#111" letter-spacing="${num > 9 ? -0.004 : 0}">${num}</text>`;
    }
    s += gloss + `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" ${edge}/>`;
    return s + "</g>";
  }
  function ghost(x, y, label) {
    const r = G.ballR * MODE.ball, k = MODE.thumb ? 1.6 : 1;
    let s = `<circle cx="${f(x)}" cy="${sy(y)}" r="${f(r)}" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.95" stroke-width="${f(0.011 * k)}" stroke-dasharray="${f(0.028 * k)} ${f(0.02 * k)}"/>`;
    if (label != null && !MODE.thumb) s += `<text x="${f(x)}" y="${f(sy(y) + 0.032)}" font-size="0.085" text-anchor="middle" font-family="'Saira Condensed',Arial Narrow,sans-serif" font-weight="700" fill="#fff"${up(x, sy(y))}>${esc(label)}</text>`;
    return s;
  }
  function cueStick(c) {
    const [x, y] = c.at, [tx, ty] = c.to;
    const L0 = Math.hypot(tx - x, ty - y) || 1, ux = (tx - x) / L0, uy = (ty - y) / L0;
    const back = (d) => [x - ux * d, y - uy * d];
    const gap = c.gap ?? 0.07, len = c.len ?? 2.7;
    const seg = (d0, d1, w0, w1, fill) => {
      const a = back(gap + d0), b = back(gap + d1), nx = -uy, ny = ux;
      const q = [[a[0] + nx * w0, a[1] + ny * w0], [b[0] + nx * w1, b[1] + ny * w1], [b[0] - nx * w1, b[1] - ny * w1], [a[0] - nx * w0, a[1] - ny * w0]];
      return `<polygon points="${q.map(pt).join(" ")}" fill="${fill}" stroke="rgba(0,0,0,.45)" stroke-width="0.005" stroke-linejoin="round"/>`;
    };
    const wT = 0.027 * MODE.line, wB = 0.058 * MODE.line;
    const w = (d) => wT + (wB - wT) * (d / len);
    let s = `<g opacity="${c.op ?? 1}">`;
    s += `<line x1="${f(back(gap)[0])}" y1="${sy(back(gap)[1])}" x2="${f(back(gap + len)[0])}" y2="${sy(back(gap + len)[1])}" stroke="rgba(0,0,0,.25)" stroke-width="${wB * 2.6}" stroke-linecap="round" transform="translate(0.03 0.04)"/>`;
    s += seg(0, 0.03, wT, wT, "#2f5d9a");
    s += seg(0.03, 0.1, wT, w(0.1), "#f4f1e8");
    s += seg(0.1, len * 0.62, w(0.1), w(len * 0.62), "#e8cf9c");
    s += seg(len * 0.62, len * 0.64, w(len * 0.62), w(len * 0.64), "#cfcfcf");
    s += seg(len * 0.64, len, w(len * 0.64), wB, "#3a2417");

  }
  function badge(x, y, n, col) {
    if (MODE.thumb) return "";
    return `<g${up(x, sy(y))}><circle cx="${f(x)}" cy="${sy(y)}" r="0.085" fill="${col || "#ffffff"}" stroke="rgba(0,25,45,.8)" stroke-width="0.012"/>` +
      `<text x="${f(x)}" y="${f(sy(y) + 0.036)}" font-size="0.105" text-anchor="middle" font-family="'Saira Condensed',Arial Narrow,sans-serif" font-weight="800" fill="#0b1f2e">${esc(n)}</text></g>`;
  }
  function pointAlong(pts, t) {
    const seg = []; let tot = 0;
    for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(l); tot += l; }

  }
  const STYLE = {
    cue: { color: "#ffffff", solid: true, w: 0.03 },
    obj: { color: "#ffd23a", solid: false, w: 0.028 },
    alt: { color: "#ffffff", solid: false, w: 0.022, op: 0.85 },
    aim: { color: "#ffffff", solid: false, w: 0.012, op: 0.7, dash: "0.025 0.03", arrow: false },
    blue: { color: "#2a6bff", solid: false, w: 0.028 },

  function path(p, uid) {

o the top rail and into the 6, then back off the rail to stop behind the 8 while the 6 rolls to the foot rail.","tip":[{"x":0,"y":0.42}],"t":{"balls":[[6,3,3.69],[7,1,3.69],[8,2,3.69],[9,6.02,3.03],["c",6.52,2],["c",2.06,3.87,"faint"],[6,0.1,1.52,"faint"]],"paths":[{"pts":[[6.52,2],[3.31,3.91],[2.51,3.91],[2.16,3.88]],"kind":"cue"},{"pts":[[2.95,3.6],[0.18,1.58]],"kind":"obj","ball":6}],"cues":[{"at":[6.52,2],"to":[3.31,3.91]}]}}]}],"routine":{"howto":["Stand at one long rail, facing the table. Every spot is two numbers: Along · Up.","Along counts diamonds along your rail from the left corner pocket. The side pocket is 4, the far corner is 8.","Up counts diamonds out from your rail toward the far rail. 2 is the middle of the table, 4 is the far rail. A .5 is halfway between two diamonds: 2.5 is halfway between the 2nd and 3rd.","To find 5 · 3, sight from the 5th diamond on your rail across to the 5th on the far rail, then from the 3rd diamond on the left short rail to the 3rd on the right one. The donut goes where the two lines cross. The diagrams draw those lines dashed.","The center spot is 4 · 2, the foot spot 2 · 2 and the head spot 6 · 2."],"intro":"The same six blocks in the same order, every visit. Groove blocks repeat one shot many times to build the stroke. Deck blocks deal shots in random order, like flashcards: a miss comes back three shots later, and the shots you miss most come up more often next time. Every ball sits on a spot or where two diamond lines cross, so you can set up by eye and every rep is the same shot.","rules":[["Same order, every visit","Do the blocks top to bottom, even on days you feel good. The repetition is the point."],["Donuts down, fast resets","Mark each spot once with a donut. Find it by sighting across from a diamond on one rail to the same diamond on the other. Keep spare balls next to the donuts so a reset takes five seconds. Reset fast, shoot slow."],["Same routine, every shot","Use the ten-step pre-shot routine on every shot. Chalk every time."],["Softer than you think","Hit every shot as softly as it allows. Change speed with the length of your backstroke, not by pushing harder."],["Freeze","Stay down and still until the balls stop. Watch where the cue ball goes from where you are."],["Only clean reps count","A rep counts only when it meets the block's standard. Be strict. The numbers only help if they are honest."],["No sidespin","Center of the cue ball, a bit above for follow, a bit below for stop and draw. Nothing left or right."]],"preshot":{"think":[["Chalk","Every shot, the same way: a few light brushes, not drilling, until the whole tip is covered. Put the chalk down chalk side up."],["Read the next ball","Find the ball after this one. Picture its line to its pocket and stretch it back across the table. That line splits the table in two."],["Pick a side and a spot","Choose the half where the cue ball should land, the side that leaves an angle toward the ball after that. Then pick the exact spot, with some room along the line, not across it."],["Decide the hit","Two choices only: tip height (above center, center or below) and speed (soft, medium soft or medium). Say it in your head: \"below center, soft, stop on the spot.\""],["See the line and the ghost ball","Pick the exact point in the pocket, trace the line back through the object ball, and picture the ghost ball: the spot the cue ball has to fill."]],"act":[["Aim standing up","Stand behind the cue ball with your chin over the line to the ghost ball. All the aiming happens here, not once you are down."],["Step in and drop down","Back foot on the line, cue already pointing down it, then drop straight down without losing the picture. Bridge a hand length from the cue ball. Loose grip."],["Check before you stroke","Tip lined up on the spot you chose on the cue ball, cue level and still. A tiny fix is fine. If anything feels off, stand up and start again from step 1."],["Practice strokes","Three slow ones the same length as the real stroke, tip stopping right at the cue ball. Eyes go cue ball, object ball, cue ball, then stay on the object ball. Slow back, pause."],["Stroke, freeze, check","Smooth through and a long finish. Freeze until the cue ball stops. Then ask: did it go where you said in step 4? That answer is your lesson."]],"decisions":"Every shot answers three questions before you bend down: where the cue ball goes, which tip height, and how hard. If you can't answer all three, you are not ready to shoot."},"fixes":"Most misses at this stage come from the stroke, not the aim: a poke instead of a smooth stroke, a tight grip, jumping up, hitting too hard and a different routine on every shot. Repeating one shot builds the stroke. Mixing the shots up is what makes it stick, because every shot in a game is a little different.","blocks":[{"id":"routine","link":"preshot","kind":"sets","name":"Pre-shot routine","ask":"How many did you get right?","min":[7,7],"short":true,"rate":0.7,"what":"Practice the ten steps themselves until they run on their own, in the same order on every shot.","setup":"Throw three object balls out anywhere and take ball in hand. Shoot them in any order, then throw them out again. The diagram is only an example.","fixes":"Rushing, deciding while already down on the shot, and a different routine on every shot.","focus":["Slow is fine. The goal is the same steps every time, not speed.","Chalk is step 1 on every shot. No exceptions.","Call the cue ball's spot before you bend down, every time."],"counts":"All ten steps done in order, and the cue ball stops where you called it.","sets":[{"label":"3 shots in slow motion, saying every step out loud","reps":1,"check":true},{"label":"Call your spot: drop a chalk cube where the cue ball should stop","reps":5},{"label":"Pick a side of the next ball's line","reps":5}],"related":["Vision Center Drill","Stop, Follow, Draw Drill"],"levels":[{"name":"Within a diamond","desc":"Easy shots, ball in hand. Each spot counts if the cu const vOf = d => d.variants ? d.variants[d.vi] : null;

const keyOf = d => { const v = vOf(d); return v && v.log ? d.slug + '~' + d.vi : d.slug; };
const entries = k => prog.logs[k] || [];

function hashOf(s){

    if (s.q) add('q', s.q);
    if (s.view !== 'grid') add('view', s.view);
    if (s.section) add('section', s.section);
  }
  if (pg.id === 'routine' && s.length !== 'daily') add('length', s.length);
  if (s.drill) { add('drill', s.drill); if (s.layout > 1) add('layout', s.layout); }

// reads a link back into plain values; anything unknown falls back to its default. Returns null for no link.

  if (!pg) return null;

  return {
    page: pg.id, skill: SK[g('skill')] ? g('skill') : '', diff: LEVELS.indexOf(g('level')), q: g('q'),
    view: VIEWS.includes(g('view')) ? g('view') : 'grid', table: P.TABLES[g('table')] ? g('table') : 'wpa',
    section: sections.some(s => s.id === section) ? section : '',
    drill: d ? d.slug : '', layout: d && d.variants ? Math.min(d.variants.length, Math.max(1, parseInt(g('layout'), 10) || 1)) : 1,

const fmtDate = ts => new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'});
let lastSave = null;

  if (spec.pass == null) { status = e.length ? `Best: ${spec.better==='low' ? Math.min(...e.map(x=>x[1])) : Math.max(...e.map(x=>x[1]))} ${esc(spec.unit)}. Last: ${e[e.length-1][1]}.` : 'No scores yet.'; }

  const unit = `${spec.max?`of ${spec.max} `:''}${esc(spec.unit)}`;

    ? `<div class="pick" role="group" aria-label="Pick your score, ${unit}" style="--n:${spec.max < 11 ? spec.max+1 : Math.ceil((spec.max+1)/2)};--m:${spec.max < 6 ? spec.max+1 : Math.ceil((spec.max+1)/2)}">${Array.from({length:spec.max+1},(_,n)=>`<button type="button" data-pick="${n}" aria-pressed="false" class="${meets(spec,n)?'ok':''}">${n}</button>`).join('')}</div>

}

}
// the table on the dark rail, like a drill card; under it the tag (the shot card names the side while you play) and the zoom
const board = (b, bd) => `<div class="board bp-board"><div class="svgwrap" data-rz="${b.id}">${P.render(Object.assign({ title: b.name }, bd.t), { text: textK() })}</div><div class="bp-foot">${bd.tag && !bd.play ? `<span class="rb-tag">${bd.tag}</span>` : '<span></span>'}<button type="button" class="zoom rb-big" data-rz="${b.id}" aria-label="Enlarge the table">${ZOOM}</button></div></div>`;
function longChart(){
  const b = RBy.long, pts = Object.keys(prog.rt.days).sort().map(k=>({ k, e: entryOf(k, 'long') })).filter(x=>x.e && stat(b, x.e).done).slice(-20);
  if (!pts.length) return `<small>Your long straight shot score shows up here after you finish that block.</small>`;
  const W = 320, H = 96, top = 8, base = H - 16, n = Math.max(pts.length, 8), slot = W / n, bw = Math.min(24, slot * 0.62), y = v => base - (base - top) * v;
  const ty = y(b.rate);
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Long straight shots made, in percent, last ${pts.length} sessions">`;
  svg += `<line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="var(--rule)" stroke-width="1"/>`;
  svg += `<line x1="0" x2="${W}" y1="${ty}" y2="${ty}" stroke="var(--ink-2)" stroke-width="1" stroke-dasharray="3 3" opacity=".7"/><text x="${W}" y="${ty - 4}" text-anchor="end" font-size="10" font-family="var(--mono)" fill="var(--ink-2)">target ${pct(b.rate)}</text>`;
  pts.forEach((p, i) => {
    const st = stat(b, p.e), v = rateOf(st), x = i * slot + (slot - bw) / 2, yy = y(v), h = base - yy, r = Math.min(3, h, bw / 2);
    if (h > 0) svg += `<path d="M${x} ${base}V${yy + r}Q${x} ${yy} ${x + r} ${yy}H${x + bw - r}Q${x + bw} ${yy} ${x + bw} ${yy + r}V${base}Z" fill="var(--chalk)"/>`;
    svg += `<rect x="${i * slot}" y="0" width="${slot}" height="${H}" fill="transparent" data-tip="${esc(fmtKey(p.k))} · ${st.made}/${st.max} (${pct(v)}) · level ${p.e.lvl || 1}"/>`;
  });

  svg += `<text x="${lastX}" y="${y(rateOf(last)) - 5}" text-anchor="middle" font-size="11" font-weight="600" font-family="var(--mono)" fill="var(--ink)">${pct(rateOf(last))}</text>`;
  svg += `<text x="0" y="${H - 2}" font-size="10" font-family="var(--mono)" fill="var(--ink-2)">${esc(fmtKey(pts[0].k))}</text></svg>`;

// everything about how to play a block, folded: the point, this level, what counts, the usual faults, finding a spot

  return fold('hp-' + b.id, 'How to play', `<p>${esc(b.what)}</p>${lv.desc ? `<p><b>This level.</b> ${esc(lv.desc)}</p>` : ''}
    ${b.id === 'routine' ? `<ol class="steps10">${RT.preshot.think.concat(RT.preshot.act).map(x=>`<li>${esc(x[0])}</li>`).join('')}</ol>` : ''}
    <p><b>Made means</b> ${esc(b.counts)}</p><ul class="focus">${b.focus.map(f=>`<li>${esc(f)}</li>`).join('')}</ul><p><b>Usual faults.</b> ${esc(b.fixes)}</p>

    ${rel.length ? `<div class="rel">${rel.map(nm=>`<button type="button" data-open="${esc(nm)}">${esc(nm)}</button>`).join('')}</div>` : ''}`, 'howplay');

/* ---------- a block's page: a setup screen, then a training screen, then done ----------
   Setup: 1 pick a level (each with a picture of its layout), 2 put the donuts down (one picture per half of the table,
   every spot written on it), 3 the shots in this level, each as a picture. Then Start.
   Training: only the shot. The table shows where the cue ball goes (ringed, its spot tagged, its sight lines bright),
   then Made or Missed. Undo and Start over are always there; Set up goes back to change the level.
   Done: the score, each side, the level, and Next block or Another round. */
// a button that needs a second tap to act (start over), so nothing is lost by one stray tap
let rtArm = '', rtArmT = 0;
function armed(key){
  if (rtArm === key) { rtArm = ''; clearTimeout(rtArmT); return true; }
  rtArm = key; clearTimeout(rtArmT); rtArmT = setTimeout(() => { rtArm = ''; rtRedraw(); }, 3500);
  return false;
}
// a fresh deal for a block today, at the level already picked; live goes straight into training
function freshEntry(id, live){
  const k = touch(), day = prog.rt.days[k] || (prog.rt.days[k] = { b: {} }), b = RBy[id], old = day.b[id];
  const lvl = (old && old.lvl) || levelOf(id).lvl, v = vol();
  const e = day.b[id] = Object.assign({ lvl, v, q: queueFor(b, lvl, v), d: [] }, live ? { live: 1 } : { pre: 1 });
  rtSave(e); return e;
}
// another round after a block is done: more shots on the same day, so today's score counts them all
function againEntry(id){
  const b = RBy[id], e = rtEntry(id);
  e.q = e.q.concat(queueFor(b, e.lvl || 1, volOf(e))); delete e.pre; delete e.fin; e.live = 1; rtSave(e);
}
const head = (b, i, sub) => `<button type="button" class="bp-back" data-rtback>${BACK}Routine</button>
  <div class="sec-head bp-head"><span class="sec-num">${i + 1}</span><h2>${esc(b.name)}</h2><p>${esc(sub)}</p></div>`;
const stepH = (n, t, aside) => `<div class="kh step-h"><b><i>${n}</i>${t}</b>${aside ? `<span>${aside}</span>` : ''}</div>`;
const thumb = t => P.render(t, { thumb: { ball: 1.6, line: 1.6 } });

function setupPane(b, e, L, lv, i){
  const st = stat(b, e), started = e && !e.pre && e.d.length > 0 && !st.done;
  const n = e && !st.done ? e.q.filter(id => !isCheck(id)).length : stat(b, null).max;
  // 1: every level as a picture of its layout and its name; the history's pick is marked
  const lvls = b.levels.length < 2 ? '' : stepH(1, 'Pick a level') + `<div class="lvc">${b.levels.map((x, k) => { const on = k + 1 === L.lvl;
    return `<button type="button" class="lvcard${on ? ' on' : ''}" data-lvset="${b.id}:${k + 1}" aria-pressed="${on}"><span class="thumb">${thumb(x.setup[0].t)}</span><span class="lvc-t"><small>Level ${k + 1}${k + 1 === L.rec ? ' · <em>your level</em>' : ''}</small><b>${esc(x.name)}</b></span></button>`; }).join('')}</div>`;
  // 2: where the donuts go, as pictures with the spots written on them
  const pics = lv.setup.map((s, k) => `<figure class="pic">${s.side != null ? `<figcaption>${sideChip(s.side, 1)}</figcaption>` : s.example ? '<figcaption><span class="kl">An example: any easy shots will do</span></figcaption>' : ''}<div class="board"><div class="svgwrap" data-rzs="${b.id}:${k}">${P.render(Object.assign({ title: b.name + ' setup' }, s.t), { text: textK() })}</div></div></figure>`).join('');
  const donuts = stepH(b.levels.length < 2 ? 1 : 2, lv.spots && lv.spots.length ? 'Put the donuts down' : 'Set up', lv.spots && lv.spots.length ? 'along · up, in diamonds' : '') +
    (lv.spots && lv.spots.length ? (layDone() ? '<p class="setup-p">Already down if you laid out the table: these are the ones this block uses.</p>' : '') : `<p class="setup-p">${esc(b.setup || '')}</p>`) + `<div class="pics${lv.setup.length > 1 ? ' two' : ''}">${pics}</div>`;
  // 3: the shots in this level, each as a picture
  const cards = isDeck(b) ? lv.cards : cardsOf(b, lv, e ? volOf(e) : vol());
  const shots = stepH(b.levels.length < 2 ? 2 : 3, 'The shots', isDeck(b) ? `${n} dealt in random order` : 'in this order') + `<div class="shots">${cards.map(c => `<button type="button" class="shot" data-rzc="${b.id}:${c.id}"><span class="thumb">${thumb(c.t)}</span><span class="shot-t">${c.side != null ? `<i class="dot s${c.side}"></i>` : ''}${esc(isDeck(b) ? (c.short || c.name) : c.name)}${!isDeck(b) && !c.check && c.reps > 1 ? ` <small>× ${c.reps}</small>` : ''}</span></button>`).join('')}</div>`;
  const start = started
    ? `<button type="button" class="go" data-dks="${b.id}">Continue · shot ${e.d.length + 1} of ${e.q.length}</button><button type="button" class="ghostbtn" data-rtreset="${b.id}">${rtArm === 'r:' + b.id ? 'Tap again to start over' : 'Start over'}</button>`
    : st.done ? `<button type="button" class="go" data-rtagain="${b.id}">Another round · ${stat(b, null).max} shots</button>`
    : `<button type="button" class="go" data-dks="${b.id}">${b.run ? 'Start training · as long as you like' : `Start training · ${n} shots`}</button>`;
  return `<section class="rt rt-block rt-setup" id="rb-${b.id}" data-rb="${b.id}" data-step="setup">
    ${head(b, i, `${minsOf(b, rtLen)} min · level ${L.lvl}, ${lv.name}`)}
    ${lvls}${donuts}${shots}${howPlay(b, lv)}

  </section>`;
}
// a run: balls potted in a row since the last miss, and the longest today
const runOf = e => { let now = 0, best = 0; (e.d || []).forEach(r => { now = r[1] ? now + 1 : 0; best = Math.max(best, now); }); return { now, best }; };
function trainPane(b, e, L, lv, i){
  const st = stat(b, e), cards = cardsOf(b, lv, volOf(e)), byId = Object.fromEntries(cards.map(c=>[c.id, c]));
  const k = e.d.length, n = e.q.length, cur = byId[e.q[k]] || cards[0], last = e.d[e.d.length-1];
  const back = last && last.length > 3 ? `<p class="back">Missed: that shot comes back in 3.</p>` : '';
  const btns = cur.check ? `<div class="dk-btns one"><button type="button" class="dk-btn ok" data-dk="${b.id}:1">${CHECK}Done</button></div>`
    : `<div class="dk-btns"><button type="button" class="dk-btn ok" data-dk="${b.id}:1">${CHECK}Made</button><button type="button" class="dk-btn no" data-dk="${b.id}:0"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6"/></svg>Missed</button></div>`;
  const say = cur.plain ? '' : `<h3 class="now-t${cur.name.length > 24 ? ' long' : ''}">${esc(cur.name)}</h3>`;
  return `<section class="rt rt-block rt-train" id="rb-${b.id}" data-rb="${b.id}" data-step="play">
    <div class="tr-top"><button type="button" class="bp-back" data-rtstep="${b.id}:setup">${BACK}Set up</button><b class="tr-name"><span>${i + 1}</span>${esc(b.name)}</b><span class="tr-n">${b.run ? `run ${runOf(e).now} · best ${runOf(e).best}` : `${k + 1} / ${n}`}</span></div>
    ${b.run ? '' : `<div class="pbar" aria-hidden="true"><i style="width:${(100 * k / n).toFixed(1)}%"></i></div>`}
    <div class="tr-grid">
      <div class="board bp-board"><div class="svgwrap" data-rz="${b.id}">${P.render(Object.assign({ title: b.name }, cur.t), { text: textK() })}</div><div class="bp-foot">${sideChip(cur.side, 1) || '<span></span>'}<button type="button" class="zoom rb-big" data-rz="${b.id}" aria-label="Enlarge the table">${ZOOM}</button></div></div>
      <div class="tr-side now dk-card" aria-live="polite">${say}${btns}${back}
        <div class="now-f">${k ? `<button type="button" class="undo" data-dku="${b.id}">Undo</button>` : ''}<span>${st.tried ? `${st.made} of ${st.tried} made` : ''}</span>${b.run && k ? `<button type="button" class="undo" data-rtfin="${b.id}">Finish</button>` : ''}<button type="button" class="undo" data-rtreset="${b.id}:live">${rtArm === 'r:' + b.id + ':live' ? 'Tap again to start over' : 'Start over'}</button></div>
      </div>
    </div>
  </section>`;
}
function donePane(b, e, L, lv, i, nxt){

  e.d.forEach(([c, m]) => { if (isCheck(c)) return; const x = by[c] || (by[c] = [0, 0]); x[0] += m; x[1]++; const a = sd[String(c)[0] === 'm' ? 1 : 0]; a[0] += m; a[1]++; });
  const cards = isDeck(b) ? lv.cards : [];
  const chips = cs => cs.filter(c=>by[c.id]).map(c=>`<span class="${by[c.id][0] < by[c.id][1] ? 'miss' : ''}"><b>${esc(c.short || c.id.replace(/^m/, ''))}</b> ${by[c.id][0]}/${by[c.id][1]}</span>`).join('');
  const today = !cards.length ? '' : lv.tR ? `<div class="dk-today">${sideChip(0)}${chips(cards.filter(c=>!c.side))}</div><div class="dk-today">${sideChip(1)}${chips(cards.filter(c=>c.side))}</div>` : `<div class="dk-today">${chips(cards)}</div>`;
  const sides = lv.tR && sd[1][1] ? `<p class="lr">${sideChip(0, 1)} ${sd[0][0]}/${sd[0][1]}<span></span>${sideChip(1, 1)} ${sd[1][0]}/${sd[1][1]}</p>` : '';
  const more = today + (isDeck(b) ? cardBars(b, lv) : '') + sideLine(b, lv);
  const allDone = blocksFor(rtLen).every(x=>stat(x, entryOf(curKey(), x.id)).done);
  const go = nxt && !stat(nxt, entryOf(curKey(), nxt.id)).done ? `<button type="button" class="go" data-rbt="${nxt.id}">Next: ${esc(nxt.name)}</button>` : `<button type="button" class="go" data-rtback>${allDone ? 'Session done' : 'Back to the routine'}</button>`;
  return `<section class="rt rt-block rt-done-pane" id="rb-${b.id}" data-rb="${b.id}" data-step="done">
    ${head(b, i, `Done · level ${L.lvl}, ${lv.name}`)}
    <div class="sheet fin now"><div class="kh"><b>${CHECK}Done</b><span>target ${pct(b.rate)}</span></div>
      <p class="now-t">${st.made}<small> / ${st.max}</small><em class="${r >= b.rate ? 'ok' : ''}">${st.tried ? pct(r) : ''}</em></p>
      ${b.run ? `<p class="lr">Best run today: ${runOf(e).best}</p>` : ''}${sides}<p class="climb">${hintFor(b, L, e)}</p>
      <div class="fin-btns">${go}<button type="button" class="ghostbtn" data-rtagain="${b.id}">Another round</button><button type="button" class="ghostbtn" data-rtstep="${b.id}:setup">Set up</button></div>
      ${more ? fold('dn-' + b.id, 'By shot and side', more) : ''}</div>
  </section>`;
}
function blockPage(b){
  const k = curKey(), list = blocksFor(rtLen), i = list.indexOf(b), e = entryOf(k, b.id), L = levelOf(b.id), lv = lvOf(b, L.lvl);
  const step = stepOf(b, e);
  rtFocus = step === 'play';
  return step === 'setup' ? setupPane(b, e, L, lv, i) : step === 'play' ? trainPane(b, e, L, lv, i) : donePane(b, e, L, lv, i, list[i + 1]);
}


/* ---------- lay out the table: every donut of today's session, once, before the first block ----------
   The blocks share spots (the center spot, the 1, 2 and 3 up rows), so the whole session goes down in one go.
   Donuts are flat: balls roll over them, so they all stay down while you play. */
const fmtN = v => String(Math.round(v * 2) / 2);
function layoutSpots(){
  const out = new Map();
  blocksFor(rtLen).forEach((b, i) => { const lv = lvOf(b, levelOf(b.id).lvl);
    [...(lv.spots || []), ...(lv.spotsR || [])].filter(s => s.x != null && !/^Target/.test(s.name)).forEach(s => {
      const key = s.x + ',' + s.y, o = out.get(key) || { x: s.x, y: s.y, n: [] }; if (!o.n.includes(i + 1)) o.n.push(i + 1); out.set(key, o); }); });
  return [...out.values()];
}
const layDone = () => { const d = prog.rt.days[curKey()]; return !!(d && d.b && d.b._lay); };
function layoutPic(S){
  const cnt = (k, v) => S.filter(s => s[k] === v).length, refs = [], ticks = [], labels = [];
  const ln = o => { if (!refs.some(r => r.x === o.x && r.y === o.y)) refs.push(o); };
  S.forEach(s => {
    const row = cnt('y', s.y) >= 3, col = !row && cnt('x', s.x) >= 3;
    if (row) { ln({ y: s.y }); if (s.x % 1) ticks.push({ x: s.x }); } else if (col) { ln({ x: s.x }); if (s.y % 1) ticks.push({ y: s.y }); } else { ln({ x: s.x }); ln({ y: s.y }); }
    const text = row ? fmtN(s.x) : col ? fmtN(s.y) : fmtN(s.x) + ' · ' + fmtN(s.y);
    if (col) labels.push({ x: s.x + 0.2, y: s.y, text, size: 0.17, anchor: 'start' }); else labels.push({ x: s.x, y: s.y + (s.y > 3.4 ? -0.3 : 0.3), text, size: 0.17 });
  });
  return { numbers: true, refs, ticks, labels, positions: S.map(s => [s.x, s.y]) };
}
// the rows to put down, one line each: every "up" line with two or more donuts, then any donut left over
function layoutRows(S){
  const left = S.slice(), rows = [];
  [...new Set(S.map(s => s.y))].sort((a, c) => c - a).forEach(y => { const r = left.filter(s => s.y === y); if (r.length < 2) return;
    r.forEach(s => left.splice(left.indexOf(s), 1)); rows.push([`${fmtN(y)} up`, 'along ' + r.map(s => s.x).sort((a, c) => a - c).map(fmtN).join(', '), [...new Set(r.flatMap(s => s.n))].sort((a, c) => a - c)]); });
  left.forEach(s => rows.push([`${fmtN(s.x)} · ${fmtN(s.y)}`, 'one donut', s.n]));
  return rows;
}
function layoutPage(){
  const S = layoutSpots(), list = blocksFor(rtLen);
  const rows = layoutRows(S).map(([a, b, n]) => `<tr><th scope="row">${esc(a)}</th><td>${esc(b)}</td><td class="for">${n.map(x => `<i>${x}</i>`).join('')}</td></tr>`).join('');
  return `<section class="rt rt-block rt-setup" id="rb-layout" data-rb="layout" data-step="setup">
    <button type="button" class="bp-back" data-rtback>${BACK}Routine</button>
    <div class="sec-head bp-head"><span class="sec-num">0</span><h2>Lay out the table</h2><p>${S.length} donuts for all ${list.length} blocks, put down once</p></div>
    ${stepH(1, 'Every donut of today', 'along · up, in diamonds')}
    <div class="pics"><figure class="pic"><div class="board"><div class="svgwrap" data-rzl="1">${P.render(Object.assign({ title: 'All donuts for today' }, layoutPic(S)), { text: textK() })}</div></div></figure></div>
    ${stepH(2, 'Row by row', 'numbers: the blocks that use it')}
    <table class="spots lay"><tbody>${rows}</tbody></table>
    <p class="setup-p">For a straight row: lay a cue on the line from the diamond on one rail to the same diamond on the other, and set the donuts along it.</p>
    <div class="startbar"><button type="button" class="go" data-rtlay>${layDone() ? 'Go to block 1' : 'Done, the table is laid out'}</button></div>
  </section>`;
}

/* ---------- the overview ---------- */
function overview(){
  const k = curKey(), list = blocksFor(rtLen), sts = list.map(b=>stat(b, entryOf(k, b.id))), doneN = sts.filter(s=>s.done).length;
  const ses = sessionKeys(), weekAgo = dayKey(Date.now() - 6 * 864e5), wk = ses.filter(x=>x >= weekAgo).length;
  const lt = ses.map(x=>entryOf(x,'long')).filter(e=>e && stat(RBy.long, e).done).map(e=>stat(RBy.long, e));
  const lastT = lt.length ? lt[lt.length-1] : null, prevT = lt.length > 1 ? lt[lt.length-2] : null;
  const dl = lastT && prevT ? Math.round(100 * (rateOf(lastT) - rateOf(prevT))) : null;
  const set = new Set(ses), today = dayKey();
  const strip = Array.from({length:28},(_,i)=>{ const dk = dayKey(Date.now() - (27 - i) * 864e5); return `<i class="${set.has(dk) ? 'on' : ''}${dk === today ? ' today' : ''}" data-tip="${esc(fmtKey(dk))}${set.has(dk) ? ': trained' : ''}"></i>`; }).join('');
  const step = x => `<li><b>${esc(x[0])}</b> ${esc(x[1])}</li>`;
  const minsFor = l => blocksFor(l).reduce((a,b)=>a + minsOf(b, l), 0);
  const lenBtn = l => `<button type="button" data-rtlen="${l}" aria-pressed="${rtLen===l}">${LENS[l]} <small>${minsFor(l)}m</small></button>`;
  // the next block to play is marked in the list; there is nothing else to press
  const ni0 = sts.findIndex(s=>!s.done), ni = !layDone() && !sts.some(x => x.started) ? -2 : ni0;
  const rows = list.map((b, i) => { const s = sts[i], e = entryOf(k, b.id), live = !s.done && e && !e.pre && e.d.length;
    const meta = s.done ? `${s.made}/${s.max} · ${pct(rateOf(s))}` : live ? `${e.d.length}/${e.q.length} · ${pct(rateOf(s))}` : `${minsOf(b, rtLen)} min`;
    return `<li class="rb${s.done ? ' done' : ''}${i === ni ? ' next' : ''}" data-rb="${b.id}" id="rb-${b.id}"><button type="button" class="rb-head" data-rbt="${b.id}"><span class="rb-n">${s.done ? CHECK : i + 1}</span><span class="rb-t"><b>${esc(b.name)}</b><span class="rb-s"${s.tried ? ` title="${s.made} of ${s.tried}"` : ''}>${meta}</span></span>${i === ni ? `<span class="rb-go">${live ? 'Continue' : 'Start'}</span>` : `<span class="rb-c">${CHEV}</span>`}</button></li>`; }).join('');
  const fin = ni0 >= 0 ? '' : (() => { const r = list.reduce((a,b)=>{ const st = stat(b, entryOf(k,b.id)); return [a[0] + st.made, a[1] + st.max]; }, [0,0]);
    const moves = list.map(b=>[b, nextLevel(b.id), entryOf(k,b.id).lvl || 1]).filter(([b,n,l])=>n !== l).map(([b,n,l])=>`${esc(b.name)} goes ${n > l ? 'up' : 'down'} to level ${n}`);

/* ---------- opening a link ---------- */
// puts the page in the state a link describes; it only redraws what changed
let applying = false;
function applyLink(st, first){
  applying = true;
  const sig = () => JSON.stringify([mode, skill, diff, q, view, tkey, rtLen, mode === 'routine' ? rtOpen : '']);
  const was = sig();
  mode = st.page; store.set('drillbook.mode', mode);
  if (PAGE[mode].library) { skill = st.skill; diff = st.diff; qText = st.q; q = normQ(qText); view = st.view; store.set('drillbook.view', view); }
  setTable(st.table);
  if (mode === 'routine') { setLength(st.length); rtOpen = st.block; }
  pressTabs(); syncFilters();
  if (first || sig() !== was) draw();
  if (PAGE[mode].library && st.section) toSection(st.section);
  const d = st.drill ? bySlug.get(st.drill) : null;
  if (d) { const vi = st.layout - 1; if (openDrill !== d || d.vi !== vi || !dd.open) { d.vi = vi; showDrill(d, false); } }
  else dropDrill();
  applying = false;
  spy(); writeLink(false);
}
const onAddress = () => { const st = parseHash(location.hash); if (st && hashOf(st) !== hashOf(linkState())) applyLink(st, false); };
window.addEventListener('popstate', onAddress);
window.addEventListener('hashchange', onAddress);

/* ---------- start ---------- */
if (!PAGE[mode]) mode = 'routine';
const firstLink = parseHash(location.hash);
press('[data-view]', 'view', view); pressTabs();
if (firstLink) applyLink(firstLink, true); else { draw(); writeLink(false); }
})();
</script>
<script>if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(function(){});</script>
</body>
